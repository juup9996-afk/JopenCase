    else if (t.dataset.view) showView(t.dataset.view);
    else if (t.dataset.act) onAct(t.dataset.act, t.dataset.id, t);
    else if (t.dataset.f) { if (t.dataset.f === 'dup') UI.dup = !UI.dup; else UI.filter = t.dataset.f; UI.armDup = false; UI.collN = PAGE_N; renderColl(); }
    else if (t.dataset.card) openCardFrom(t);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#crop').hidden) closeCrop();
      else if (!$('#aigen').hidden) closeAi();
      else if (!$('#setai').hidden) closeSetAi();
      else if (!$('#rand').hidden) closeRand();
      else if (!$('#sheet').hidden) closeSheet();
      else if (!$('#lightbox').hidden) closeLB();
      else if (!$('#opener').hidden) closeOpener();
      else if (ED) onEd('back');
    } else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('rar')) {
      e.preventDefault(); openCardFrom(e.target);
    }
  });

  // Bilder, die nicht laden: kurz erneut versuchen, sonst Platzhalter statt Fragezeichen
  const hideBroken = t => { t.style.display = 'none'; if (t.parentElement) t.parentElement.classList.add('missing'); };
  document.addEventListener('error', e => {
    const t = e.target;
    if (!t || (t.tagName !== 'IMG' && t.tagName !== 'VIDEO') || !t.closest('.c-art,.t-art')) return;
    const src = t.getAttribute('src') || '';
    if (!src || /^(blob|data):/.test(src)) { hideBroken(t); return; }
    const n = +(t.dataset.retry || 0);
    const base = t.dataset.base || (t.dataset.base = src);
    if (n < 3) {
      t.dataset.retry = String(n + 1);
      setTimeout(() => { if (t.isConnected) t.src = base.replace(/#.*$/, '') + (base.includes('?') ? '&' : '?') + 'r=' + Date.now() + (t.tagName === 'VIDEO' ? '#t=0.1' : ''); }, 900 * (n + 1));
      return;
    }
    hideBroken(t);
    DIAG.img++;
    if (DIAG.img === 1) {
      fetch(base, { cache: 'no-store' })
        .then(r => { DIAG.status = 'HTTP ' + r.status; }, () => { DIAG.status = 'keine Verbindung'; })
        .then(() => { if (current === 'com') renderCom(); });
    } else if (current === 'com') renderCom();
  }, true);

  // Editor
  $('#editor').addEventListener('click', e => {
    if (!ED) return;
    const t = e.target.closest('[data-ed],[data-efilter],[data-theme],[data-bar],.cell[data-cid]');
    if (!t) return;
    if (t.dataset.ed) onEd(t.dataset.ed);
    else if (t.dataset.efilter) { ED.filter = t.dataset.efilter; ED.gridN = PAGE_N; renderEdChips(); renderEdGrid(); }
    else if (t.dataset.theme) {
      ED.draft.theme = t.dataset.theme; ED.dirty = true;
      $$('#editor .sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === ED.draft.theme)));
    } else if (t.dataset.bar) onBar(t.dataset.bar, t.dataset.v);
    else if (t.dataset.cid) {
      if (ED.selMode) {
        const id = t.dataset.cid, on = !ED.sel.has(id);
        if (on) ED.sel.add(id); else ED.sel.delete(id);
        const th = t.querySelector('.thumb'), mk = t.querySelector('.selmark');
        if (th) th.classList.toggle('sel', on);
        if (mk) mk.classList.toggle('on', on);
        renderEdBar();
      } else openSheet(t.dataset.cid);
    }
  });

  // Einzelne Karte
  $('#sheet').addEventListener('click', e => {
    if (!ED || !SH) return;
    const t = e.target.closest('[data-sh],[data-rset],[data-lset]');
    if (!t) return;
    const c = cur();
    if (!c) return;
    if (t.dataset.sh === 'close') closeSheet();
    else if (t.dataset.sh === 'del') {
      if (t.dataset.armed !== '1') {
        t.dataset.armed = '1'; t.textContent = 'Wirklich löschen?';
        setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Karte löschen'; } }, 3000);
      } else delCard();
    } else if (t.dataset.rset) { c.r = t.dataset.rset; ED.dirty = true; paintSheet(); }
    else if (t.dataset.lset) { c.l = t.dataset.lset; ED.dirty = true; paintSheet(); }
    else if (t.dataset.sh === 'crop') openCrop();
    else if (t.dataset.sh === 'aigen') shAiGen();
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (ED && t.id === 'sh-name' && SH) { const c = cur(); if (c) { c.n = t.value.slice(0, 28); ED.dirty = true; } }
    else if (ED && t.id === 'sh-val' && SH) { const c = cur(); if (c) { const m = parseMoney(t.value); if (!t.value.trim()) delete c.v; else if (m != null) c.v = Math.min(m, 99999999); ED.dirty = true; } }
    else if (ED && t.id === 'ed-name') { ED.draft.name = t.value; ED.dirty = true; }
    else if (ED && t.id === 'ed-price') priceFromInput(false);
    else if (ED && t.dataset && t.dataset.odd) {
      const x = parseFloat(t.value);
      ED.draft.odds[t.dataset.odd] = Number.isFinite(x) && x >= 0 ? Math.min(x, 1000) : 0;
      ED.dirty = true;
    } else if (ED && (t.id === 'ed-percase' || t.id === 'ed-perbooster')) { ED.dirty = true; updateEV(); }
    if (ED && t.dataset && t.dataset.odd) updateEV();
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'imp-file') {
      const fs = [...(t.files || [])]; t.value = '';
      if (fs.length) await importFiles(fs);
    } else if (!ED) return;
    else if (t.id === 'ed-files') {
      const files = [...(t.files || [])]; t.value = '';
      if (files.length) await addPhotos(files);
    } else if (t.id === 'sh-file') {
      const f = t.files && t.files[0]; t.value = '';
      if (!f || !SH) return;
      busy('Wird verarbeitet …');
      try {
        const { blob, m } = await prepMedia(f), c = cur();
        if (c) {
          if (c._url) URL.revokeObjectURL(c._url);
          c._blob = blob; c._url = URL.createObjectURL(blob); ED.dirty = true;
          if (m) c.m = m; else delete c.m;
          c.z = 1; c.x = 0; c.y = 0;
          paintSheet();
        }
      } catch (err) { toast(err && err.big ? 'Das Video ist größer als 15 MB.' : 'Das Bild kann ich nicht lesen.'); }
      busy(null);
    } else if (t.id === 'sh-name') {
      if (SH) { const c = cur(); if (c) { c.n = t.value.trim().slice(0, 28) || 'Karte'; t.value = c.n; paintSheet(); } }
    } else if (t.id === 'ed-looksel') {
      if (t.value) applySel(c => { c.l = t.value; });
      renderEdBar();
    } else if (t.id === 'ed-price') priceFromInput(true);
    else if (t.id === 'ed-percase') t.value = clampInt(t.value, 1, 100, 15);
    else if (t.id === 'ed-perbooster') t.value = clampInt(t.value, 1, 40, 15);
  });

  // ================= Sicherer Start =================
  const mediaRefsAll = () => [...skAllRefs(), ...homeRefs()];
  const CRASH_WHERE = { boot: 'beim Starten', home: 'auf dem Startbildschirm', import: 'beim Hinzufügen von Fotos', save: 'beim Speichern eines Cases', photos: 'beim Laden der Fotos',
    'view:coll': 'in der Sammlung', 'view:case': 'in der Case-Ansicht', 'view:inv': 'im Inventar', 'view:com': 'bei deinen Cases', 'view:set': 'in den Einstellungen', 'view:gacha': 'im Gacha', 'view:slot': 'im Slot', 'view:lobby': 'in der Slot-Lobby', 'view:game': 'in einem Slot', 'view:comics': 'bei den Comics' };
  function safeBar() {
    const b = $('#safebar');
    if (!b) return;
    if (!SAFE) { b.hidden = true; b.innerHTML = ''; return; }
    b.hidden = false;
    b.innerHTML = '<span>Sicherer Start: Fotos sind aus.</span><button class="btn small" data-act="safeoff">Fotos laden</button>';
  }
  function safeNotice() {
    safeBar();
    const pe = BE && BE.photoError && BE.photoError();
    if (pe) {
      dlg(`<h3>Die Fotos lassen sich nicht lesen</h3>
        <p class="note" style="max-width:none">Die Datenbank deines Browsers meldet einen Fehler: „${esc(pe.message || pe)}“. Deine Cases sind da, nur ohne Bilder. Oft hilft es, das iPhone neu zu starten und die App danach wieder zu öffnen.</p>
        <p class="note" style="max-width:none">Hilft das nicht, kannst du die gespeicherten Fotos löschen. Die Cases bleiben, die Bilder musst du dann neu hinzufügen.</p>
        <div class="row"><button class="btn primary" data-act="dlgclose">Weiter ohne Fotos</button><button class="btn" data-act="dropphotos">Fotos löschen …</button></div>`);
      return;
    }
    if (!CRASH) return;
    const where = CRASH_WHERE[CRASH.v] || 'in der App';
    dlg(`<h3>Die App ist beim letzten Mal abgestürzt</h3>
      <p class="note" style="max-width:none">Das war ${esc(where)}. Meistens geht dem Handy dabei der Arbeitsspeicher aus, zum Beispiel bei sehr vielen Fotos. Damit du wieder hineinkommst, habe ich die Fotos vorerst ausgeschaltet. Deine Cases, Karten und Startoken sind noch da.</p>
      <p class="note" style="max-width:none">Oben siehst du „Fotos laden“. Stürzt die App danach wieder ab, bleiben die Fotos beim nächsten Start einfach wieder aus.</p>
      <div class="row"><button class="btn primary" data-act="dlgclose">Weiter ohne Fotos</button><button class="btn" data-act="safeoff">Fotos laden</button></div>`);
  }
  ACTS.safeoff = async () => {
    SAFE = false;
    try { localStorage.removeItem(SAFE_KEY); } catch (e) { /* egal */ }
    closeDlg(); safeBar(); guardArm('photos', 8000);
    busy('Fotos werden geladen …');
    try { if (BE.photoError && BE.photoError()) await BE.loadKeys(); } catch (e) { console.warn(e); }
    try { await BE.ensure(mediaRefsAll()); } catch (e) { console.warn(e); }
    busy(null);
    refresh(); lzKick();
  };

  // ================= Start =================
  const APP_BUILD = 'V18';
  window.__jbstat = () => (BE && BE.stats ? BE.stats() : null);
  async function init() {
    try {
      BE = await pickBackend();
      if (BE.mode === 'cloud') { SAFE = false; CRASH = null; }
      try { if (BE.mode === 'local' && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* egal */ }
      await loadAll();
      if (BE.photoError && BE.photoError()) SAFE = true;   // Fotoliste nicht lesbar: ohne Fotos starten
      if (!SAFE) { try { await BE.ensure(mediaRefsAll()); } catch (e) { console.warn('Medien laden', e); } }
      try { await seedDemo(); } catch (e) { console.error(e); }
      updateStats();
      showView('home');
      startTicker();
      if (SAFE) safeNotice();
    } catch (e) {
      console.error(e);
      guardClear();
      $('#view-home').hidden = false;
      $('#view-home').innerHTML = `<div class="empty-note"><b>Start fehlgeschlagen</b><span>${esc((e && e.message) || e)}</span>
        <span style="font-size:12px;opacity:.75">Version ${APP_BUILD}${e && e.step ? ' · Schritt: ' + esc(e.step) : ''}</span>
        <span>Das ist ein Fehler in der Datenbank deines Browsers. Deine Daten sind meist noch da. Starte zuerst das iPhone neu und öffne die App danach wieder. Das hilft in den meisten Fällen.</span>
        <div class="row" style="justify-content:flex-start"><button class="btn small" data-act="reload">Neu laden</button></div>
        <span style="font-size:12px;opacity:.75">Nur wenn gar nichts mehr hilft:</span>
        <div class="row" style="justify-content:flex-start"><button class="btn small" data-act="startwipe">Alle Daten auf diesem Gerät löschen …</button></div></div>`;
    }
  }
  // Rettung bei Datenbank-Fehlern: Fotos oder alles loeschen (nur nach Rueckfrage)
  const wipeDb = name => new Promise((res, rej) => { const r = indexedDB.deleteDatabase(name); const t = setTimeout(() => rej(new Error('blockiert')), 10000); r.onsuccess = () => { clearTimeout(t); res(); }; r.onerror = () => { clearTimeout(t); rej(r.error); }; });
  ACTS.dropphotos = () => {
    dlg(`<h3>Fotos wirklich löschen?</h3>
      <p class="note" style="max-width:none">Alle gespeicherten Fotos, GIFs und Videos auf diesem Gerät werden gelöscht. Deine Cases, Karten, Startoken und Einstellungen bleiben. Nur die Bilder fehlen danach und müssen neu hinzugefügt werden.</p>
      <div class="row"><button class="btn" data-act="dlgclose">Abbrechen</button><button class="btn primary" data-act="dropphotosgo">Ja, Fotos löschen</button></div>`);
  };
  ACTS.dropphotosgo = async () => {
    closeDlg(); busy('Fotos werden gelöscht …');
    try {
      const db = await idbOpen();
      await new Promise((res, rej) => { const tx = db.transaction('photos', 'readwrite'); tx.objectStore('photos').clear(); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('abgebrochen')); });
      db.close();
      try { localStorage.removeItem(SAFE_KEY); } catch (e) { /* egal */ }
      location.reload();
    } catch (e) { busy(null); console.error(e); toast('Das ging nicht: ' + ((e && e.message) || e)); }
  };
  ACTS.startwipe = () => {
    dlg(`<h3>Alles auf diesem Gerät löschen?</h3>
      <p class="note" style="max-width:none">Dabei gehen alle Cases, Fotos, Startoken, Designs und Einstellungen verloren, die in dieser App auf diesem Gerät liegen. Das kannst du nicht rückgängig machen. Mach das nur, wenn Neu laden und ein Neustart des iPhones nicht geholfen haben. Hast du eine Sicherung („Alles sichern“), kannst du sie danach wieder einlesen.</p>
      <div class="row"><button class="btn primary" data-act="dlgclose">Abbrechen</button><button class="btn" data-act="startwipego">Ja, alles löschen</button></div>`);
  };
  ACTS.startwipego = async () => {
    closeDlg(); busy('Wird gelöscht …');
    try {
      await wipeDb('jopenbox');
      try { localStorage.removeItem(SAFE_KEY); localStorage.removeItem(GUARD_KEY); } catch (e) { /* egal */ }
      location.reload();
    } catch (e) { busy(null); console.error(e); toast('Das ging nicht: ' + ((e && e.message) || e) + '. Schließe die App ganz und versuche es nochmal.'); }
  };
  init();
})();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body></html>
