  let STD = null;
  function buildStandard() {
    if (STD) return STD;
    const r = rng(20261014);
    const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const pick = a => a[Math.floor(r() * a.length)];
    const all = CATS.flatMap(c => c.items);
    let deck = [];
    const next = () => { if (!deck.length) deck = shuf(all); return deck.pop(); };
    const used = new Set(), cards = [];
    const push = (rk, name, emoji) => cards.push({ id: 's' + String(cards.length + 1).padStart(3, '0'), n: name, r: rk, l: 'auto', p: null, e: emoji });
    Object.keys(STD_COUNTS).forEach(rk => {
      for (let i = 0; i < STD_COUNTS[rk]; i++) {
        const [emoji, noun, g] = next();
        let name = null;
        if (rk === 'common' && !used.has(noun)) name = noun;
        for (let t = 0; !name && t < 40; t++) {
          const cand = `${pick(ADJ[rk])}${ENDING[g]} ${noun}`;
          if (cand.length <= 28 && !used.has(cand)) name = cand;
        }
        if (!name) { let k = 2; while (used.has(`${noun} ${k}`)) k++; name = `${noun} ${k}`; }
        used.add(name);
        push(rk, name, emoji);
      }
    });
    ULTRA_CARDS.forEach(([e, nm]) => push('ultra', nm, e));

    const w = host.querySelector('.wheel'), items = [...w.querySelectorAll('.wh-item')];
    let raf = 0, t = 0, lastTick = -1, quietUntil = 0;
    const idx = () => Math.max(0, Math.min(items.length - 1, Math.round(w.scrollTop / WH)));
    const paint = () => {

    const t = String(text || '').replace(/```(?:json)?/gi, '');
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) throw new Error('kein_format');
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { throw new Error('kein_format'); }
  }
  const saTier = s => {
    s = String(s || '').toLowerCase().trim();
    if (SA_TIERS.includes(s)) return s;
    if (/uncommon|^c\b|gew[oö]hnlich/.test(s)) return 'common';
    if (/secret|hyper|gold|special|sir\b|legend/.test(s) && /ultra|gold|hyper/.test(s)) return 'ultra';
    return null;
  };
  const saNum = x => { const m = parseMoney(String(x == null ? '' : x).replace(/[^\d.,]/g, '')); return m; };

  const saMetaPrompt = name => `[[META]] Du bist Experte für Sammelkarten und Sammelkarten-Produkte (Pokémon, Yu-Gi-Oh!, Magic, Panini, Topps, Formel 1 und mehr).
Aufgabe: Beschreibe das folgende Set oder Produkt so, wie es wirklich ist, für eine Nachbau-App. Nutze nur, was du einigermaßen sicher weißt, und schätze lieber vorsichtig, als zu erfinden.
Set oder Produkt: "${name.replace(/["\n\r\\]/g, ' ')}"
Antworte NUR mit einem JSON-Objekt, ohne Text drumherum:
{"gefunden": true oder false (false, wenn du das Set nicht sicher kennst),
 "name": "kurzer deutscher Anzeigename, höchstens 38 Zeichen",
 "kartenGesamt": Anzahl verschiedener Karten im Set (Zahl, höchstens 600),
 "booster": Karten pro Booster (Zahl),
 "boosterProProdukt": Anzahl Booster im Produkt (Zahl),
 "preisEUR": üblicher Ladenpreis des Produkts in Euro (Zahl),
 "design": einer von "nacht","ozean","glut","wald","violett","gold", passend zur Hauptfarbe der Booster-Verpackung,
 "stufen": [{"name":"Originalname der Seltenheit","stufe":"common|rare|epic|legendary|mythic|ultra","chance":Prozent pro Karten-Platz im Booster,"karten":Anzahl Karten dieser Stufe im Set}],
 "hinweis": "ein kurzer Satz, worauf der Nutzer achten soll, wenn du dir bei etwas unsicher bist"}
Regeln für "stufe": common = häufigste Karten (Common und Uncommon), rare = Rare und Holo, epic = Double Rare, Ultra Rare, EX, V, legendary = Illustration Rare und Full Art, mythic = Special Illustration Rare, Secret, Hyper Rare, ultra = die allerseltensten (Gold, Signaturen). Nicht jede Stufe muss vorkommen. Die "chance"-Werte aller Stufen ergeben zusammen ungefähr 100.`;
  const saCardsPrompt = (meta, name, a, b) => `[[KARTEN ${a}-${b}]] Du bist Experte für Sammelkarten. Set: "${meta.name}" (Anfrage des Nutzers: "${name.replace(/["\n\r\\]/g, ' ')}"). Das Set hat ${meta.total} Karten.
Seltenheiten im Set: ${meta.tiers.map(t => `${t.name} = ${t.tier}`).join('; ') || 'common, rare, epic, legendary, mythic, ultra'}.
Liste die Karten Nr. ${a} bis ${b} in Set-Reihenfolge, genau eine Karte pro Zeile, im Format:
Nr|Kartenname|stufe|Preis in Euro|Emoji
- Kartenname: so wie auf der Karte, höchstens 26 Zeichen.
- stufe: common, rare, epic, legendary, mythic oder ultra (nach den Seltenheiten oben).
- Preis: üblicher aktueller Einzelkartenpreis in Euro, ungefähr (z. B. 0,10 oder 12,50).
- Emoji: ein passendes Emoji zum Motiv der Karte.
Nur die Zeilen, keine Überschrift, kein weiterer Text.`;
  function saParseLines(text) {
    const out = [];
    String(text || '').split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*(\d{1,4})\s*[|;]\s*([^|;]{1,60}?)\s*[|;]\s*([A-Za-z]+)\s*[|;]\s*([^|;]*?)\s*(?:[|;]\s*(.*?))?\s*$/);
      if (!m) return;
      const tier = saTier(m[3]);
      if (!tier) return;
      let em = firstGlyph(m[5] || '');
      if (/^[\x20-\x7e]*$/.test(em)) em = '';
      out.push({ nr: +m[1], n: m[2].replace(/[<>&"'`\\]/g, '').trim().slice(0, 28) || 'Karte', r: tier, v: saNum(m[4]), e: em });
    });
    return out;
  }

  function saPaint(lines, state) {
    const el = $('#sa-prog');
    if (!el) return;
    el.hidden = false;
    el.innerHTML = lines.map(l => `<div class="sa-line${l.done ? ' ok' : ''}${l.err ? ' err' : ''}">${l.done ? '✓' : l.err ? '✕' : '<i class="spin"></i>'}<span>${esc(l.t)}</span></div>`).join('') +
      (state === 'run' ? '<div class="row"><button class="btn small" data-setai="stop">Abbrechen</button></div>' : '');
  }
  async function saRun() {
    const name = ($('#sa-name').value || '').trim();
    if (name.length < 3) { toast('Gib den Namen des Sets oder Produkts ein.'); return; }
    await getSample();
    const rd = apReady('text');
    if (!rd.ok) { toast(rd.why); return; }
    const ctl = new AbortController();
    SA.run = ctl; SA.name = name;
    $('#sa-go').disabled = true;
    const lines = [{ t: 'Set erkunden …' }];
    saPaint(lines, 'run');
    try {
      const mt = await saAsk(saMetaPrompt(name), ctl.signal);
      const j = saJson(mt.text);
      if (j.gefunden === false) { lines[0] = { t: 'Dieses Set kenne ich nicht sicher. Probier den genauen Namen mit Reihe und Jahr.', err: true }; saPaint(lines, 'end'); $('#sa-go').disabled = false; SA.run = null; return; }
      const meta = {
        name: String(j.name || name).replace(/[<>&"'`\\]/g, '').slice(0, 40) || 'Nachbau',
        total: clampInt(j.kartenGesamt, 1, 600, 100),
        perBooster: clampInt(j.booster, 1, 40, 10),
        perCase: clampInt(j.boosterProProdukt, 1, 100, 10),
        price: (() => { const x = +j.preisEUR; return Number.isFinite(x) && x > 0 && x < 100000 ? Math.round(x * 100) : 0; })(),
        theme: THEMES.some(t => t[0] === j.design) ? j.design : 'nacht',
        note: String(j.hinweis || '').replace(/[<>]/g, '').slice(0, 240),
        tiers: (Array.isArray(j.stufen) ? j.stufen : []).map(t => ({ name: String(t && t.name || '').replace(/[<>&"'|;]/g, '').slice(0, 30), tier: saTier(t && t.stufe), chance: +t.chance || 0, n: +t.karten || 0 })).filter(t => t.tier).slice(0, 12),
      };
      lines[0] = { t: `Gefunden: ${meta.name} · ${meta.total} Karten · ${meta.perBooster} Karten pro Booster`, done: true };
      const rows = new Map();
      let from = 1, calls = 0;
      while (from <= meta.total && calls < SA_MAX_CALLS) {
        const to = Math.min(meta.total, from + SA_CHUNK - 1);
        lines.push({ t: `Karten ${from} bis ${to} …` }); saPaint(lines, 'run');
        calls++;
        const r = await saAsk(saCardsPrompt(meta, name, from, to), ctl.signal);
        const got = saParseLines(r.text).filter(x => x.nr >= 1 && x.nr <= meta.total);
        got.forEach(x => { if (!rows.has(x.nr)) rows.set(x.nr, x); });
        const hi = got.reduce((m, x) => Math.max(m, x.nr), 0);
        lines[lines.length - 1] = { t: `Karten ${from} bis ${to}: ${got.length} gelesen`, done: got.length > 0, err: !got.length };
        if (!got.length) break;
        from = Math.max(from + 1, hi + 1);
      }
      if (!rows.size) throw new Error('kein_format');
      const preset = saBuild(meta, [...rows.values()].sort((a, b) => a.nr - b.nr));
      SA.run = null; saPaint(lines, 'end');
      closeSetAi();
      saReview(meta, preset);
    } catch (e) {
      SA.run = null;
      lines[lines.length - 1] = { t: saErr(e), err: true }; saPaint(lines, 'end');
      const b = $('#sa-go'); if (b) b.disabled = false;
    }
  }
  function saBuild(meta, rows) {
    const cards = rows.slice(0, MAX_CARDS).map(r => ({ id: uid(6), n: r.n, r: r.r, l: 'auto', p: null, e: r.e || SA_EMOJI[r.r], ...(r.v != null ? { v: Math.min(r.v, 99999999) } : {}) }));
    const have = new Set(cards.map(c => c.r));
    const odds = {};
    SA_TIERS.forEach(k => { odds[k] = 0; });
    meta.tiers.forEach(t => { if (have.has(t.tier)) odds[t.tier] += Math.max(0, t.chance); });
    SA_TIERS.forEach(k => { if (have.has(k) && !(odds[k] > 0)) odds[k] = DEF_ODDS[k] != null ? DEF_ODDS[k] : 1; if (!have.has(k)) odds[k] = DEF_ODDS[k] != null ? DEF_ODDS[k] : 0; });
    SA_TIERS.forEach(k => { odds[k] = Math.round(odds[k] * 1000) / 1000; });
    const preset = { id: uid(8), name: meta.name, theme: meta.theme, perCase: meta.perCase, perBooster: meta.perBooster, odds, cards, created: Date.now(), pv: MONEY_VER };
    const tmp = normCase({ ...preset, price: 0, pv: 0 });
    preset.price = meta.price > 0 ? Math.min(meta.price, 99999999) : fairPrice(caseEV(tmp));
    return preset;
  }
  function saReview(meta, preset) {
    const cs = normCase(preset), ev = caseEV(cs);
    const counts = {}; cs.cards.forEach(c => { counts[c.r] = (counts[c.r] || 0) + 1; });
    const priced = cs.cards.filter(c => c.v != null).length;
    dlg(`<h3>${esc(cs.name)}</h3>
      <p class="muted">${cs.cards.length} Karten · ${cs.perCase} Booster pro Case · ${cs.perBooster} Karten pro Booster</p>
      <div class="chips">${RARITIES.filter(r => counts[r.k]).map(r => `<span class="chip r-${r.k}"><span class="dot"></span>${counts[r.k]}× ${r.n}</span>`).join('')}</div>
      <p class="note">Case-Preis: <b>${esc(fmtTok(cs.price))}</b>${meta.price ? ' (Ladenpreis laut KI)' : ' (fairer Preis)'}. Ø Wert der Karten in einem Case: <b>${esc(fmtTok(ev))}</b>. Kartenpreise bei ${priced} von ${cs.cards.length} Karten von der KI.</p>
      ${meta.note ? `<p class="warn-note">KI-Hinweis: ${esc(meta.note)}</p>` : ''}
      <p class="warn-note">Das kommt aus dem Wissen der KI, ohne Live-Abfrage im Netz. Namen, Seltenheiten und Preise können falsch sein, und aktuell ist das nicht garantiert. Fotos kopiere ich nicht: Die Karten haben Emojis als Platzhalter. Du kannst alles im Editor ändern und eigene Fotos setzen.</p>
      <div class="row"><button class="btn" data-act="dlgclose">Verwerfen</button><button class="btn primary" data-act="saopen">Im Editor öffnen</button></div>`);
    SA.preset = preset;
  }
  ACTS.saopen = () => { const p = SA.preset; SA.preset = null; closeDlg(); if (p) { openEditor(null, p); toast('Set nachgebaut. Prüf die Liste und tippe auf Speichern.'); } };

        <label class="field"><span>Set oder Produkt</span><input type="text" id="sa-name" maxlength="120" placeholder="z. B. ${esc(SA_EXAMPLES[0])}" autocomplete="off"></label>
        <div class="chips">${SA_EXAMPLES.map((x, i) => `<button class="chip" data-setai="ex" data-i="${i}">${esc(x.length > 34 ? x.slice(0, 33) + '…' : x)}</button>`).join('')}</div>

  // ================= Speichern und Löschen =================
  async function saveEditor(keepOpen) {
    const ed = ED;
    if (!ed || ed.saving) return false;
    const d = ed.draft;
    d.name = ($('#ed-name').value || '').trim().slice(0, 40);
    d.perCase = clampInt($('#ed-percase').value, 1, 100, 15);
    d.perBooster = clampInt($('#ed-perbooster').value, 1, 40, 15);
    if (ed.pmode === 'wheel' && WHEEL) d.price = WHEEL.get();
    else if (ed.pmode === 'input') { const c = parseMoney(($('#ed-price') || {}).value); if (c != null) d.price = Math.min(c, 99999999); }
    RARITIES.forEach(r => {
      const x = parseFloat($(`[data-odd="${r.k}"]`).value);
      d.odds[r.k] = Number.isFinite(x) && x >= 0 ? Math.min(x, 1000) : 0;
    });
    if (!d.name) { toast('Gib dem Case einen Namen.'); $('#ed-name').focus(); return false; }
    if (!d.cards.length) { toast('Füge mindestens eine Karte hinzu.'); return false; }
    ed.saving = true;
    const todo = d.cards.filter(c => c._blob);
    let done = 0, failed = false;
    try {
      busy(todo.length ? `Fotos speichern (0/${todo.length})` : 'Speichere …', todo.length ? 0 : null);
      await pool(todo, 3, async c => {
        if (failed) return;
        try {
          const ref = await BE.putPhoto(c._blob);
          c.p = ref; c._blob = null; ed.uploaded.add(ref);
        } catch (e) { failed = true; throw e; }
        done++;
        if (!failed) busy(`Fotos speichern (${done}/${todo.length})`, done / todo.length);
      });
      const saved = normCase(serializeCase(d));
      await saveCaseDoc(saved);
      // Fotos aufräumen, die kein Case mehr braucht
      const keep = new Set(saved.cards.map(c => c.p).filter(Boolean));
      const drop = new Set();
      if (ed.orig) ed.orig.cards.forEach(c => { if (c.p && !keep.has(c.p)) drop.add(c.p); });
      ed.uploaded.forEach(r => { if (!keep.has(r)) drop.add(r); });
      await pool([...drop], 4, r => BE.dropPhoto(r));
      ed.uploaded = new Set();
      const i = S.cases.findIndex(c => c.id === saved.id);
      const isNew = i < 0;
      if (isNew) S.cases.push(saved); else S.cases[i] = saved;
      S.cases.sort((a, b) => a.created - b.created);
      progOf(saved.id);
      ed.orig = saved; ed.dirty = false;
      busy(null);
      if (keepOpen) toast('Gespeichert.');
      else {
        closeEditor();
        toast(isNew ? 'Gespeichert. Tippe auf „Ins Inventar“, um Booster zu öffnen.' : 'Gespeichert.');
      }
      return true;
    } catch (e) {
      failed = true;
      busy(null);
      console.error(e);
      toast('Speichern fehlgeschlagen. Deine Änderungen sind noch da, versuch es nochmal.');
      return false;
    } finally { ed.saving = false; }
  }

  async function deleteCase() {

    } catch (e) { busy(null); reportErr(e, 'Löschen fehlgeschlagen.'); return; }
    S.cases = S.cases.filter(c => c.id !== cs.id);
    delete S.prog[cs.id]; dirtyProg.delete(cs.id);

  // ================= Teilen, Sichern, Importieren =================
  const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'case';
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  async function buildPackage(list, withProg, wallet) {
    const refs = [...new Set(list.flatMap(cs => cs.cards.map(c => c.p).filter(Boolean)))];
    const photos = {};
    let i = 0;
    await pool(refs, 4, async ref => {
      try {
        const b = await BE.blobOf(ref);
        if (b) photos[ref] = await blobToDataURL(b);
      } catch (e) { console.warn('Foto fehlt', ref, e); }
      i++; busy(`Datei wird gepackt (${i}/${refs.length})`, i / Math.max(1, refs.length));
    });
    return {
      app: 'jopenbox', v: 1,
      cases: list.map(cs => withProg ? { case: serializeCase(cs), prog: progOf(cs.id) } : { case: serializeCase(cs) }),
      photos,
      ...(wallet ? { wallet: { c: MONEY_VER, tokens: tokens(), standard: progOf('standard'), slot: await slotExport(photos) } } : {}),
    };
  }
  async function saveFile(filename, text) {
    const blob = new Blob([text], { type: 'application/json' });
    let dl = null;
    try { if (window.claude && typeof claude.use === 'function') dl = await claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try { await dl.save({ filename, data: blob }); toast('Datei gespeichert.'); return; } catch (e) {
        const c = e && e.code;
        if (c === 'declined') return;
        if (!(c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed')) { reportErr(e, 'Datei konnte nicht gespeichert werden.'); return; }
      }
    }
    offerFile(filename, blob);
  }
  // Ohne Claude-Anbindung: Die Datei wird erst nach einem frischen Tipp gesichert,
  // weil iOS Teilen und Download nur direkt nach einer Berührung erlaubt.
  function offerFile(filename, blob) {
    const b = $('#busy');
    const mb = (Math.max(0.1, blob.size / 1048576)).toFixed(1).replace('.', ',');
    b.hidden = false;
    b.innerHTML = `<div class="busy-card"><div>Die Datei ist fertig (${mb} MB).</div>
      <button class="btn primary" id="sv-go">Sichern</button><button class="btn small" id="sv-x">Schließen</button></div>`;
    $('#sv-x').onclick = () => busy(null);
    $('#sv-go').onclick = async () => {
      for (const type of ['application/json', 'text/plain']) {
        try {
          const f = new File([blob], filename, { type });
          if (navigator.canShare && navigator.canShare({ files: [f] })) {
            await navigator.share({ files: [f], title: filename });
            busy(null); toast('Datei gesichert.'); return;
          }
        } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 8000);
      busy(null); toast('Download gestartet.');
    };
  }
  async function exportCases(list, withProg, filename, wallet) {

    busy(null);
    await saveFile(filename, text);
  }

  async function importFile(file) {
    let pkg;
    try { pkg = JSON.parse(await readAs(file, 'readAsText')); } catch (e) { toast('Diese Datei kann ich nicht lesen.'); return; }
    const hasWallet = !!(pkg && pkg.wallet && typeof pkg.wallet === 'object');
    if (!pkg || pkg.app !== 'jopenbox' || !Array.isArray(pkg.cases) || (!pkg.cases.length && !hasWallet)) { toast('Das ist keine JopenBox-Datei.'); return; }
    const photos = pkg.photos && typeof pkg.photos === 'object' ? pkg.photos : {};
    const entries = pkg.cases.filter(en => en && en.case).slice(0, 50);
    let n = 0;
    try {
      for (const entry of entries) {
        busy(`Importiere ${n + 1}/${entries.length} …`, 0);
        const src = normCase(entry && entry.case);
        const cs = { ...src, id: uid(8), demo: false, created: Date.now() + n };
        while (S.cases.some(c => c.id === cs.id)) cs.id = uid(8);
        const refs = [...new Set(cs.cards.map(c => c.p).filter(Boolean))];
        const map = new Map();
        let k = 0, lastErr = null;
        await pool(refs, 3, async ref => {
          const du = photos[ref];
          if (typeof du === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,/.test(du)) {
            try { map.set(ref, await BE.putPhoto(dataURLToBlob(du))); } catch (e) { lastErr = e; }
          }
          k++; busy(`Importiere ${n + 1}/${entries.length}: Fotos ${k}/${refs.length}`, k / Math.max(1, refs.length));
        });
        if (lastErr && !map.size) throw lastErr;
        cs.cards.forEach(c => { c.p = c.p ? (map.get(c.p) || null) : null; });
        await saveCaseDoc(cs);
        S.cases.push(cs);
        const pr = entry && entry.prog ? normProg(entry.prog) : normProg({});
        S.prog[cs.id] = pr;
        if (entry && entry.prog) await BE.setDoc('prog_' + cs.id, pr);
        n++;
      }
    } catch (e) {
      busy(null); console.error(e);
      S.cases.sort((a, b) => a.created - b.created); refresh();
      toast(n ? `${n} Case importiert, dann ist ein Fehler aufgetreten.` : 'Import fehlgeschlagen.');
      return;
    }
    S.cases.sort((a, b) => a.created - b.created);
    let restored = false;
    if (hasWallet) {
      // Beim Wiederherstellen gilt jeweils der höhere Stand, damit nichts verloren geht.
      const w = pkg.wallet, add = clampInt(w.tokens, 0, 100000000000, 0) * (w.c === MONEY_VER ? 1 : 15);
      S.meta.tokens = Math.max(tokens(), add);
      if (w.standard && typeof w.standard === 'object') {
        const b = normProg(w.standard), std = progOf('standard');
        Object.keys(b.counts).forEach(k => { std.counts[k] = Math.max(std.counts[k] || 0, b.counts[k]); });
        std.boosters = Math.max(std.boosters, b.boosters); std.opened = Math.max(std.opened, b.opened); std.cases = Math.max(std.cases, b.cases);
        saveProg('standard');
      }
      if (w.slot) { try { await slotImport(w.slot, photos); } catch (e) { console.warn('Slot-Import', e); } }
      saveMeta(true); restored = true;
    }
    busy(null); refresh();
    toast(n ? (n === 1 ? 'Case importiert.' : `${n} Cases importiert.`) + (restored ? ' Startoken und Standard-Sammlung sind auch zurück.' : '') : restored ? 'Startoken und Standard-Sammlung wiederhergestellt.' : 'Nichts zu importieren.');
  }

  // ================= Demo-Case =================
  async function seedDemo() {
    if (S.meta.seeded || S.cases.some(c => !c.builtin)) return;
    const names = {
      common: ['Glühwürmchen', 'Nebelfarn', 'Mondmoos', 'Tauperle', 'Dornenranke', 'Nachtfalter', 'Pilzring', 'Wurzelkröte', 'Eulenfeder', 'Kieselpfad'],
      rare: ['Silberfuchs', 'Lichtlibelle', 'Flüsterweide', 'Mondbrunnen', 'Schattenhirsch', 'Kristallblüte', 'Runenstein'],
      epic: ['Irrlichtfürst', 'Aschekranich', 'Dornenkönigin', 'Mondwolf'],
      legendary: ['Weltenbaum', 'Wächterin der Nacht'],
      mythic: ['Der Erste Stern'],
    };
    const cards = []; let n = 0;
    RARITIES.forEach(r => (names[r.k] || []).forEach(nm => cards.push({ id: 'd' + (++n), n: nm, r: r.k, l: 'auto', p: null })));
    const cs = normCase({ id: 'demo', name: 'Nachtgarten', theme: 'nacht', perCase: 15, perBooster: 15, odds: { ...DEF_ODDS }, cards, demo: true, created: Date.now() });
    const p = normProg({ inv: true, boosters: 3, opened: 2, cases: 1, added: Date.now(), counts: {} });
    for (let i = 0; i < 2; i++) rollBooster(cs).forEach(c => { p.counts[c.id] = (p.counts[c.id] || 0) + 1; });
    S.cases.push(cs); S.prog[cs.id] = p; S.meta.seeded = true;
    try {
      await saveCaseDoc(cs);
      await BE.setDoc('prog_' + cs.id, p);
      await BE.setDoc('meta', S.meta);
    } catch (e) { reportErr(e, 'Das Demo-Case konnte nicht gespeichert werden.'); }
  }

  // ================= Ereignisse =================
  function onAct(act, id, el) {
    switch (act) {
      case 'gostandard': UI.caseId = 'standard'; showView('case'); break;
      case 'pickcase': UI.caseId = id; renderCase(); break;
      case 'pickcoll': UI.collId = id; UI.filter = 'all'; UI.dup = false; UI.armDup = false; UI.armReset = false; renderColl(); break;
      case 'opencase': startCase(id); break;
      case 'openbooster': startOpen(id); break;
      case 'again': startOpen(id); break;
      case 'toinv': closeOpener(); showView('inv'); break;
      case 'editcase': openEditor(id); break;
      case 'newcase': openEditor(null); break;
      case 'randcase': openRand(); break;
      case 'addinv': addToInv(id); break;
      case 'backup': doBackup(); break;
      case 'reload': location.reload(); break;
      case 'resetprog':
        if (UI.armReset !== id) {
          UI.armReset = id; renderColl();
          setTimeout(() => { if (UI.armReset === id) { UI.armReset = false; if (current === 'coll') renderColl(); } }, 3000);
        } else {
          const p = progOf(id);
          p.counts = {}; p.opened = 0;
          saveProg(id); UI.armReset = false; refresh();
          toast('Fortschritt zurückgesetzt.');
        }
        break;
      case 'openall': startOpenAll(id); break;
      default: if (ACTS[act]) ACTS[act](id, el);
    }
  }
  function openCardFrom(t) {
    const cs = caseById(t.dataset.case);
    const c = cs && cs.cards.find(x => x.id === t.dataset.card);
    if (c) openLB(cs, c, !!t.closest('#view-coll'));
  }
  document.addEventListener('click', e => {
    if (e.target.id === 'lightbox') { closeLB(); return; }
    if (e.target.id === 'dlg') { closeDlg(); return; }
    const t = e.target.closest('[data-lbclose],[data-close],[data-view],[data-act],[data-f],.rar,.cell[data-card]');
    if (!t) return;
    if (t.hasAttribute('data-lbclose')) closeLB();
    else if (t.hasAttribute('data-close')) closeOpener();
    else if (t.dataset.view) showView(t.dataset.view);
    else if (t.dataset.act) onAct(t.dataset.act, t.dataset.id, t);
    else if (t.dataset.f) { if (t.dataset.f === 'dup') UI.dup = !UI.dup; else UI.filter = t.dataset.f; UI.armDup = false; renderColl(); }
    else if (t.dataset.card) openCardFrom(t);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#crop').hidden) closeCrop();
      else if (!$('#aigen').hidden) closeAi();
      else if (!$('#setai').hidden) closeSetAi();
      else if (!$('#rand').hidden) closeRand();
      else if (!$('#sheet').hidden) closeSheet();
      else if (!$('#lightbox').hidden) closeLB();
      else if (!$('#opener').hidden) closeOpener();
      else if (ED) onEd('back');
    } else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('rar')) {
      e.preventDefault(); openCardFrom(e.target);
    }
  });

  // Bilder, die nicht laden: kurz erneut versuchen, sonst Platzhalter statt Fragezeichen
  const hideBroken = t => { t.style.display = 'none'; if (t.parentElement) t.parentElement.classList.add('missing'); };
  document.addEventListener('error', e => {
    const t = e.target;
    if (!t || t.tagName !== 'IMG' || !t.closest('.c-art,.t-art')) return;
    const src = t.getAttribute('src') || '';
    if (!src || /^(blob|data):/.test(src)) { hideBroken(t); return; }
    const n = +(t.dataset.retry || 0);
    const base = t.dataset.base || (t.dataset.base = src);
    if (n < 3) {
      t.dataset.retry = String(n + 1);
      setTimeout(() => { if (t.isConnected) t.src = base + (base.includes('?') ? '&' : '?') + 'r=' + Date.now(); }, 900 * (n + 1));
      return;
    }
    hideBroken(t);
    DIAG.img++;
    if (DIAG.img === 1) {
      fetch(base, { cache: 'no-store' })
        .then(r => { DIAG.status = 'HTTP ' + r.status; }, () => { DIAG.status = 'keine Verbindung'; })
        .then(() => { if (current === 'com') renderCom(); });
    } else if (current === 'com') renderCom();
  }, true);

  // Editor
  $('#editor').addEventListener('click', e => {
    if (!ED) return;
    const t = e.target.closest('[data-ed],[data-efilter],[data-theme],[data-bar],.cell[data-cid]');
    if (!t) return;
    if (t.dataset.ed) onEd(t.dataset.ed);
    else if (t.dataset.efilter) { ED.filter = t.dataset.efilter; renderEdChips(); renderEdGrid(); }
    else if (t.dataset.theme) {
      ED.draft.theme = t.dataset.theme; ED.dirty = true;
      $$('#editor .sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === ED.draft.theme)));
    } else if (t.dataset.bar) onBar(t.dataset.bar, t.dataset.v);
    else if (t.dataset.cid) {
      if (ED.selMode) {
        const id = t.dataset.cid, on = !ED.sel.has(id);
        if (on) ED.sel.add(id); else ED.sel.delete(id);
        const th = t.querySelector('.thumb'), mk = t.querySelector('.selmark');
        if (th) th.classList.toggle('sel', on);
        if (mk) mk.classList.toggle('on', on);
        renderEdBar();
      } else openSheet(t.dataset.cid);
    }
  });

  // Einzelne Karte
  $('#sheet').addEventListener('click', e => {
    if (!ED || !SH) return;
    const t = e.target.closest('[data-sh],[data-rset],[data-lset]');
    if (!t) return;
    const c = cur();
    if (!c) return;
    if (t.dataset.sh === 'close') closeSheet();
    else if (t.dataset.sh === 'del') {
      if (t.dataset.armed !== '1') {
        t.dataset.armed = '1'; t.textContent = 'Wirklich löschen?';
        setTimeout(() => { if (t.isConnected) { t.dataset.armed = ''; t.textContent = 'Karte löschen'; } }, 3000);
      } else delCard();
    } else if (t.dataset.rset) { c.r = t.dataset.rset; ED.dirty = true; paintSheet(); }
    else if (t.dataset.lset) { c.l = t.dataset.lset; ED.dirty = true; paintSheet(); }
    else if (t.dataset.sh === 'crop') openCrop();
    else if (t.dataset.sh === 'aigen') shAiGen();
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if (ED && t.id === 'sh-name' && SH) { const c = cur(); if (c) { c.n = t.value.slice(0, 28); ED.dirty = true; } }
    else if (ED && t.id === 'sh-val' && SH) { const c = cur(); if (c) { const m = parseMoney(t.value); if (!t.value.trim()) delete c.v; else if (m != null) c.v = Math.min(m, 99999999); ED.dirty = true; } }
    else if (ED && t.id === 'ed-name') { ED.draft.name = t.value; ED.dirty = true; }
    else if (ED && t.id === 'ed-price') priceFromInput(false);
    else if (ED && t.dataset && t.dataset.odd) {
      const x = parseFloat(t.value);
      ED.draft.odds[t.dataset.odd] = Number.isFinite(x) && x >= 0 ? Math.min(x, 1000) : 0;
      ED.dirty = true;
    } else if (ED && (t.id === 'ed-percase' || t.id === 'ed-perbooster')) { ED.dirty = true; updateEV(); }
    if (ED && t.dataset && t.dataset.odd) updateEV();
  });
  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'imp-file') {
      const f = t.files && t.files[0]; t.value = '';
      if (f) await importFile(f);
    } else if (!ED) return;
    else if (t.id === 'ed-files') {
      const files = [...(t.files || [])]; t.value = '';
      if (files.length) await addPhotos(files);
    } else if (t.id === 'sh-file') {
      const f = t.files && t.files[0]; t.value = '';
      if (!f || !SH) return;
      busy('Foto wird verarbeitet …');
      try {
        const blob = await shrink(f), c = cur();
        if (c) {
          if (c._url) URL.revokeObjectURL(c._url);
          c._blob = blob; c._url = URL.createObjectURL(blob); ED.dirty = true;
          c.z = 1; c.x = 0; c.y = 0;
          paintSheet();
        }
      } catch (err) { toast('Das Bild kann ich nicht lesen.'); }
      busy(null);
    } else if (t.id === 'sh-name') {
      if (SH) { const c = cur(); if (c) { c.n = t.value.trim().slice(0, 28) || 'Karte'; t.value = c.n; paintSheet(); } }
    } else if (t.id === 'ed-looksel') {
      if (t.value) applySel(c => { c.l = t.value; });
      renderEdBar();
    } else if (t.id === 'ed-price') priceFromInput(true);
    else if (t.id === 'ed-percase') t.value = clampInt(t.value, 1, 100, 15);
    else if (t.id === 'ed-perbooster') t.value = clampInt(t.value, 1, 40, 15);
  });

  // ================= Start =================
  async function init() {
    try {
      BE = await pickBackend();
      try { if (BE.mode === 'local' && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* egal */ }
      await loadAll();
      try { await seedDemo(); } catch (e) { console.error(e); }
      updateStats();
      showView('home');
      startTicker();
    } catch (e) {
      console.error(e);
      $('#view-home').hidden = false;
      $('#view-home').innerHTML = `<div class="empty-note"><b>Start fehlgeschlagen</b><span>${esc((e && e.message) || e)}</span><button class="btn small" data-act="reload">Neu laden</button></div>`;
    }
  }
  init();
})();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body></html>
