<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e13"><meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JopenBox"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>JopenBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: Handy-App mit Kopfzeile, scrollender Bühne und Tab-Leiste unten.
   Ein fester dunkler Look; Farbe kommt von Seltenheit (Karten) und Design (Case/Booster). */
:root{
  --bg:#0c0e13; --surface:#141822; --surface-2:#1b2030; --line:#283044;
  --fg:#e9ebf2; --muted:#8c94a8; --accent:#d8c8a0;
  --r-common:#8d97ab; --r-rare:#5b9bff; --r-epic:#a46bff; --r-legendary:#f0b24a; --r-mythic:#ff6bd6; --r-ultra:#35f0ff;
  --display:'Instrument Serif',Georgia,serif;
  --body:'Figtree',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body.lock .stage{overflow:hidden}
button,label.btn{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[role=button]:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:3px}
h2,h3,p{margin:0}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.eyebrow{font:500 11px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2{font:400 34px/1.05 var(--display);text-wrap:balance}
h3{font:400 24px/1.1 var(--display)}
.note{color:var(--muted);font-size:13px;max-width:46ch}

/* Rahmen */
.app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.brand{font:400 27px/1 var(--display);letter-spacing:.01em;white-space:nowrap}
.stats{font:400 13px/1.15 var(--mono);color:var(--muted);text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}
.stats .st-l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.stats b{font-size:15px}
.stats b{color:var(--accent);font-weight:500}
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 16px 32px}
.view{max-width:560px;margin-inline:auto;display:flex;flex-direction:column;gap:28px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr) 52px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:7px 1px 6px;font-size:10.5px;line-height:1.1;color:var(--muted);font-weight:500;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0}
.tabs svg{width:22px;height:22px;flex:none}
.tabs .tab-set{border-left:1px solid var(--line)}
.tabs button[aria-selected=true]{color:var(--fg);box-shadow:inset 0 2px 0 var(--accent)}

/* Bedienelemente */
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--btn,var(--surface-2));color:var(--btn-fg,inherit);padding:13px 22px;border-radius:10px;font-weight:600;letter-spacing:.01em;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent,#1a1608);border-color:transparent}
.btn.small{padding:9px 14px;font-size:13.5px;font-weight:500}
.btn.danger{border-color:#6b2f3a;color:#ff9aa8}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.row.left{justify-content:flex-start}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;transform:rotate(45deg);background:var(--rc,var(--muted));flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted)}
.chip.on{color:var(--fg);border-color:var(--rc,var(--accent));background:var(--surface-2)}
.chip:disabled{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rc,var(--muted))}
.tag{flex:none;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.tag.on{color:var(--accent);border-color:var(--accent)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.empty-note{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty-note b{color:var(--fg);font-weight:600}
input[type=text],input[type=number],input[type=password],input[type=email],input[type=search],select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px;width:100%;min-width:0}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>span{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.odds input{padding:10px 6px;text-align:center}
.odds .field>span{letter-spacing:.04em;font-size:10px;display:flex;gap:5px;align-items:center}
details{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:500}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:linear-gradient(150deg,var(--f1),var(--f2));padding:0;position:relative}
.sw[aria-pressed=true]{border-color:var(--ta);box-shadow:0 0 0 3px color-mix(in srgb,var(--ta) 25%,transparent)}

/* Seltenheiten- und Design-Farben */
.r-common{--rc:var(--r-common)}.r-rare{--rc:var(--r-rare)}.r-epic{--rc:var(--r-epic)}
.r-legendary{--rc:var(--r-legendary)}.r-mythic{--rc:var(--r-mythic)}.r-ultra{--rc:var(--r-ultra)}
.th-nacht{--f1:#2b3358;--f2:#141a2e;--f3:#2a2750;--ta:#d8c8a0}
.th-ozean{--f1:#1f4f6b;--f2:#0c2233;--f3:#17435e;--ta:#8fd4e8}
.th-glut{--f1:#6e2d24;--f2:#2a1210;--f3:#5c2519;--ta:#ffb27a}
.th-wald{--f1:#21503b;--f2:#0f2219;--f3:#1a402e;--ta:#a6e0a0}
.th-violett{--f1:#4c2b72;--f2:#1c1030;--f3:#3f2263;--ta:#d6b3ff}
.th-gold{--f1:#554a2f;--f2:#1d1a12;--f3:#403720;--ta:#f0d07a}

/* Booster-Packung */
.pack{position:relative;width:min(58vw,210px);aspect-ratio:5/8;color:#cfd6ee;flex:none;container-type:inline-size}
.pack.big{width:min(64vw,260px,calc((100dvh - 220px)*5/8));cursor:pointer;touch-action:manipulation}
.foil{background:
  linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%),
  linear-gradient(160deg,var(--f1),var(--f2) 45%,var(--f3) 70%,var(--f2));
  background-size:260% 100%,100% 100%;animation:sheen 6s ease-in-out infinite alternate;
  border:1px solid color-mix(in srgb,var(--ta) 22%,var(--f1))}
@keyframes sheen{from{background-position:0% 0,0 0}to{background-position:100% 0,0 0}}
.pk-top{position:absolute;inset:0 0 auto 0;height:11%;border-radius:8px 8px 0 0;border-bottom:0;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 2px,transparent 2px 6px),linear-gradient(160deg,var(--f1),var(--f2));
  transition:transform .6s cubic-bezier(.3,.7,.3,1),opacity .5s}
.pk-body{position:absolute;inset:11% 0 0 0;border-radius:0 0 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;transition:transform .6s .1s,opacity .5s .1s}
.pk-eyebrow,.pk-count{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:color-mix(in srgb,var(--ta) 55%,#9aa4c8)}
.pk-mark{width:30%;color:var(--ta)}
.pk-name{font:400 clamp(15px,11.5cqw,34px)/1.05 var(--display);color:#eef0fa;letter-spacing:.01em;overflow-wrap:anywhere}
.pack.tearing{animation:shake .5s linear}
@keyframes shake{0%,100%{transform:none}15%{transform:rotate(-3deg) translateX(-4px)}30%{transform:rotate(3deg) translateX(4px)}45%{transform:rotate(-2deg)}60%{transform:rotate(2deg)}}
.pack.torn .pk-top{transform:translate(24px,-110px) rotate(18deg);opacity:0}
.pack.torn .pk-body{transform:translateY(40px) scale(.95);opacity:0}

/* Case */
.case{position:relative;width:min(78vw,300px);aspect-ratio:6/5;perspective:900px;container-type:inline-size;flex:none}
.case:not(.big):not(.small){animation:float 5s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.case.big{width:min(86vw,360px,calc((100dvh - 240px)*6/5));cursor:pointer;touch-action:manipulation}
.case.small{width:100%}
.case.shake{animation:shake .55s linear}
.case-body{position:absolute;inset:26% 0 0 0;z-index:2;border:1px solid color-mix(in srgb,var(--ta) 22%,var(--f1));border-radius:0 0 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center;background:linear-gradient(170deg,var(--f1),var(--f2) 60%,var(--f3));box-shadow:0 18px 40px -14px #000}
.case-body .pk-mark{width:13%}
.case-lid{position:absolute;inset:0 0 auto 0;height:28%;z-index:3;transform-origin:50% 0;border:1px solid color-mix(in srgb,var(--ta) 22%,var(--f1));border-radius:12px 12px 3px 3px;background:linear-gradient(180deg,color-mix(in srgb,var(--f1) 80%,#fff 10%),var(--f2));transition:transform .9s cubic-bezier(.3,.6,.2,1)}
.case-tape{position:absolute;left:0;right:0;top:calc(28% - 8px);height:16px;z-index:4;background:var(--ta);opacity:.92;transition:opacity .3s,transform .4s}
.case.open .case-lid{transform:rotateX(-118deg)}
.case.open .case-tape{opacity:0;transform:scaleX(.15)}
.case-peek{position:absolute;left:5%;right:5%;top:8%;height:30%;z-index:1;display:flex;align-items:flex-end;gap:2%;opacity:0;transform:translateY(40%);transition:opacity .4s .2s,transform .7s .2s cubic-bezier(.3,.7,.3,1)}
.case.open .case-peek{opacity:1;transform:translateY(-12%)}
.case-peek .mp{flex:1;min-width:0}
.mp{position:relative;aspect-ratio:5/8;border-radius:4px;border:1px solid color-mix(in srgb,var(--ta) 22%,var(--f1));overflow:hidden;background:linear-gradient(160deg,var(--f1),var(--f2) 45%,var(--f3) 70%,var(--f2))}
.mp::before{content:"";position:absolute;inset:0 0 auto 0;height:12%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 1px,transparent 1px 3px)}
.mp::after{content:"";position:absolute;left:50%;top:54%;width:24%;aspect-ratio:1;background:var(--ta);transform:translate(-50%,-50%) rotate(45deg);border-radius:2px;opacity:.85}
.mp-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;width:100%}
.mp-grid .mp{animation:pop .45s both;animation-delay:calc(var(--i)*45ms)}
@keyframes pop{from{opacity:0;transform:translateY(-34px) scale(.7) rotate(-7deg)}to{opacity:1;transform:none}}
.pile{position:relative;width:min(34vw,120px);flex:none}
.pile .pack{width:100%}
.pile .gp{position:absolute;inset:0;border-radius:8px;transform:translateX(var(--tx)) rotate(var(--rot));opacity:.9;aspect-ratio:5/8}
.pile .badge{position:absolute;right:-10px;top:-10px;z-index:3;background:var(--ta);color:#1a1608;font:500 14px var(--mono);padding:3px 10px;border-radius:999px}

/* Ansichten */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.tile-big{font:400 34px/1 var(--display);overflow-wrap:anywhere}
.tile small{font-size:12.5px;line-height:1.35}
.price-box{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.price-box b{font:400 24px/1.1 var(--display);color:var(--accent)}
.price-box small{font:400 11.5px/1.4 var(--mono)}
.val-line{font:400 13px var(--mono);color:var(--muted)}
.val-line b{color:var(--accent);font-weight:500}
.cell .val{display:block;text-align:center;font:400 11px var(--mono);color:var(--muted);margin-top:6px}
.cell.sold .thumb{opacity:.28;filter:grayscale(.8)}
.cell.sold .val{color:var(--accent)}
.o-body.summary{justify-content:flex-start;gap:0;padding:0}
.sum-scroll{flex:1;min-height:0;width:100%;overflow-y:auto;overflow-x:hidden;padding:46px 12px 16px;display:flex;flex-direction:column;gap:18px;align-items:center}
.sum-scroll>*{flex:none}
.sell-bar{flex:none;width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 4px 2px}
.sel-row{justify-content:flex-start;width:100%;padding:0 8px;gap:8px}
.sell-bar .btn{padding:10px 12px;font-size:13.5px}
.sell-bar .chip{padding:5px 12px}
.sell-bar .sum{margin-left:auto;font:400 12px var(--mono);color:var(--muted);white-space:nowrap}
.sell-bar .sum b{color:var(--accent);font-weight:500}
.sell-bar .btn{white-space:normal}
.ev-note{font-size:13px;color:var(--muted);line-height:1.45}
.ev-note b{color:var(--fg);font-weight:600}

/* Preis-Drehrad */
.wheel-host{position:relative;height:200px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent)}
.wheel{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;outline:none;perspective:600px}
.wheel::-webkit-scrollbar{display:none}
.wh-pad{height:80px}
.wh-item{height:40px;scroll-snap-align:center;display:grid;place-items:center;font:400 26px/1 var(--display);color:var(--muted);cursor:pointer;transition:color .15s;will-change:transform,opacity}
.wh-item.on{color:var(--fg)}
.wh-band{position:absolute;left:10px;right:10px;top:80px;height:40px;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);border-radius:8px;pointer-events:none;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.wh-band::after{content:"Startoken";position:absolute;right:12px;top:50%;transform:translateY(-50%);font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wheel-wrap{position:relative}
.wheel-wrap:focus-within .wh-band{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}

/* Bild anpassen */
#crop{z-index:58}
#crop .lb-card{width:min(72vw,300px,calc((100dvh - 330px)*5/7));min-width:170px}
.cropping{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.cropping:active{cursor:grabbing}
.has-pan{container-type:size}
.c-art.has-pan img,.t-art.has-pan img,.c-art.has-pan video,.t-art.has-pan video{inset:auto;left:50%;top:50%;max-width:none;object-fit:fill;transform-origin:50% 50%;
  width:max(100cqw,calc(100cqh*var(--ar,1)));height:max(100cqh,calc(100cqw/var(--ar,1)));
  transform:translate(-50%,-50%) translate(calc(var(--tx,0)*1cqw),calc(var(--ty,0)*1cqh)) scale(var(--tz,1))}
.cropping img,.cropping video{pointer-events:none;will-change:transform}
.cr-guide{position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,transparent calc(50% - .5px),rgba(255,255,255,.55) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(0deg,transparent calc(50% - .5px),rgba(255,255,255,.55) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(90deg,transparent calc(33.3% - .5px),rgba(255,255,255,.22) calc(33.3% - .5px) calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.22) calc(66.6% - .5px) calc(66.6% + .5px),transparent calc(66.6% + .5px)),
  linear-gradient(0deg,transparent calc(33.3% - .5px),rgba(255,255,255,.22) calc(33.3% - .5px) calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.22) calc(66.6% - .5px) calc(66.6% + .5px),transparent calc(66.6% + .5px))}
#crop .tilt{transform:none!important;transition:none}
#crop .flip{transition:none}
#crop .holo,#crop .glare{display:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.hero{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.hero-info{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.scroller{display:flex;gap:14px;overflow-x:auto;padding:6px 4px 14px;scroll-snap-type:x proximity}
.rar{flex:none;width:112px;display:flex;flex-direction:column;gap:10px;cursor:pointer;scroll-snap-align:start}
.rar-meta{font-size:13px;line-height:1.3;display:flex;flex-direction:column;gap:3px}
.rar-meta small{color:var(--muted);font:400 11px var(--mono)}
.inv-sec{display:flex;flex-direction:column}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.inv-tile .case{width:min(40vw,150px)}
.inv-tile .pk-eyebrow{display:none}
.inv-tile .pk-count{font-size:8px;letter-spacing:.1em}
.t-label{text-align:center;display:flex;flex-direction:column;line-height:1.3}
.t-label small{color:var(--muted);font:400 11px var(--mono)}
.prog-list{display:flex;flex-direction:column;gap:9px}
.prog{display:grid;grid-template-columns:14px 82px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.prog .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--rc);border-radius:3px}
.prog .pc{font:400 12px var(--mono);color:var(--muted);text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cell{position:relative;min-width:0}
.cell[data-card],.cell[data-cid]{cursor:pointer}
.count,.new{position:absolute;top:-7px;right:-5px;z-index:3;border-radius:999px;font:500 11px var(--mono);padding:1px 8px;border:1px solid var(--line);background:var(--surface-2)}
.new{background:var(--accent);color:#1a1608;border-color:transparent;letter-spacing:.06em}
.ghost{aspect-ratio:5/7;border:1px dashed var(--line);border-radius:7%/5%;display:grid;place-items:center;font:400 12px var(--mono);color:#4b546b}
.selmark{position:absolute;top:6px;left:6px;z-index:3;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45)}
.selmark.on{background:var(--accent);border-color:var(--accent)}
.selmark.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #1a1608;border-width:0 2px 2px 0;transform:rotate(45deg)}
.shelf{display:flex;flex-direction:column;gap:12px}
.case-row{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.case-row.create{border-style:dashed;background:transparent;text-align:left;cursor:pointer}
.cr-open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;background:none;border:0;padding:0;text-align:left}
.case-row .mp{width:42px;flex:none}
.cr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cr-name{font:400 24px/1.1 var(--display);overflow-wrap:anywhere}
.cr-meta{font:400 12px/1.4 var(--mono);color:var(--muted)}
.plus{width:42px;height:42px;flex:none;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;font-size:22px;color:var(--muted)}

/* Karte */
.card{--mx:50%;--my:50%;--ang:180;position:relative;width:100%;aspect-ratio:5/7;perspective:900px;container-type:inline-size;isolation:isolate;-webkit-tap-highlight-color:transparent}
.card.live{touch-action:none}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.card.live .tilt{transition:none}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.card.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7%/5%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{background:radial-gradient(circle at 50% 42%,#262d4a,#10131d 72%);border:1px solid #38425f;display:grid;place-items:center}
.back i{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 42%,transparent 0 9cqw,rgba(255,255,255,.05) 9cqw 9.6cqw)}
.back b{position:relative;font:400 20cqw/1 var(--display);color:var(--accent);opacity:.8}
.front{transform:rotateY(180deg);border:1px solid color-mix(in srgb,var(--rc) 60%,#000);background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 24%,#11141c),#0b0d13 72%)}
.frame{position:absolute;inset:4.5%;display:flex;flex-direction:column;gap:3%;padding:3.5%;border:1px solid color-mix(in srgb,var(--rc) 42%,transparent);border-radius:5%/3.5%}
.c-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.c-name{font:400 9.2cqw/1.05 var(--display);min-width:0;overflow-wrap:anywhere}
.gem{width:4.6cqw;height:4.6cqw;flex:none;background:var(--rc);transform:rotate(45deg);border-radius:.8cqw;box-shadow:0 0 3cqw var(--rc)}
.c-art{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:3%/2.4%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);background:#10131b}
.c-art svg,.c-art img,.t-art svg,.t-art img,.c-art video,.t-art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.c-foot{display:flex;justify-content:space-between;gap:6px;font:500 4.3cqw/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--rc) 75%,#fff)}
.holo,.glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.glare{background:radial-gradient(farthest-corner circle at var(--mx) var(--my),rgba(255,255,255,.26),transparent 55%);mix-blend-mode:overlay}
.holo{opacity:0;mix-blend-mode:color-dodge}
.hl-sheen .holo{opacity:.4;background:linear-gradient(115deg,transparent 22%,rgba(120,180,255,.6) 42%,transparent 62%);background-size:220% 220%;background-position:var(--mx) var(--my)}
.hl-foil .holo{opacity:.55;background:repeating-linear-gradient(110deg,transparent 0 5px,rgba(255,255,255,.2) 5px 6px),linear-gradient(115deg,#6f5cff,#ff6bd6,#5bd0ff);background-size:auto,260% 260%;background-position:0 0,var(--mx) var(--my)}
.hl-gold .holo{opacity:.62;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,240,190,.95),transparent 36%),repeating-radial-gradient(circle at 30% 20%,rgba(255,210,120,.4) 0 1px,transparent 1px 7px)}
.hl-rainbow .holo{opacity:.34;background:conic-gradient(from calc(var(--ang)*1deg) at 50% 50%,#ff6b6b,#ffd36b,#6bff95,#6bd6ff,#b36bff,#ff6bd6,#ff6b6b);filter:saturate(1.05)}
.hl-ultra .holo{opacity:.4;background:conic-gradient(from calc(var(--ang)*1deg) at var(--mx) var(--my),#35f0ff,#ffffff 7%,#7a5cff 20%,#ff5bd6 34%,#ffffff 44%,#35f0ff 56%,#5bffb0 72%,#ffffff 82%,#35f0ff);filter:saturate(1.1)}
.r-ultra .front{border-color:#c9fcff}
.r-ultra .frame{border-color:#9ff8ff;box-shadow:inset 0 0 5cqw -2cqw #35f0ff44}
.r-ultra .gem{animation:gemp 2.2s ease-in-out infinite alternate}
@keyframes gemp{from{box-shadow:0 0 2cqw var(--rc)}to{box-shadow:0 0 6cqw 1cqw var(--rc)}}
.r-mythic .front{border-color:#ffd9f4}
.card::before{content:"";position:absolute;inset:7%;border-radius:12%;background:var(--rc);filter:blur(30px);opacity:0;transition:opacity .5s .3s;z-index:-1}
.card.aura.flipped::before{opacity:.42}
.r-mythic.aura.flipped::before{background:conic-gradient(#ff6b6b,#ffd36b,#6bff95,#6bd6ff,#b36bff,#ff6b6b);opacity:.3}
.r-ultra.aura.flipped::before{background:conic-gradient(#35f0ff,#a8c8ff,#7a5cff,#ff5bd6,#a8c8ff,#35f0ff);opacity:.38;filter:blur(32px)}

/* Karten-Vorschau (leicht, fuer Raster mit vielen Karten) */
.thumb{--rc:var(--r-common);position:relative;aspect-ratio:5/7;border-radius:7%/5%;overflow:hidden;container-type:inline-size;border:1px solid color-mix(in srgb,var(--rc) 65%,#000);background:linear-gradient(165deg,color-mix(in srgb,var(--rc) 24%,#11141c),#0b0d13 72%);content-visibility:auto;contain-intrinsic-size:auto 140px}
.thumb.sel{outline:2px solid var(--accent);outline-offset:2px}
.thumb.r-ultra{box-shadow:0 0 0 1px #35f0ffaa,0 0 12px -4px #35f0ff66}
.thumb.r-mythic{box-shadow:0 0 0 1px #ff6bd677}
.emo{position:absolute;inset:0;display:grid;place-items:center;font-size:46cqw;line-height:1;filter:drop-shadow(0 1cqw 2cqw rgba(0,0,0,.5));pointer-events:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.chk{display:flex;gap:12px;align-items:center;font-size:15px}
.ai-prev{width:min(40vw,160px);aspect-ratio:5/7;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);align-self:center}
.ai-prev img{width:100%;height:100%;object-fit:cover;display:block}
.ai-stat{font:500 12px var(--mono);letter-spacing:.06em;color:var(--muted);margin:0}
.ai-err{color:#ff9aa8}
.chip:disabled{opacity:.4}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.c-art.missing::after,.t-art.missing::after{content:"Foto lädt nicht";position:absolute;inset:0;display:grid;place-items:center;padding:6px;text-align:center;font:500 10px/1.3 var(--mono);letter-spacing:.06em;color:var(--muted)}
.t-art{position:absolute;inset:6% 6% 22% 6%;border-radius:4%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);background:#10131b}
.t-name{position:absolute;left:8%;right:20%;bottom:5%;font:400 10.5cqw/1.1 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-gem{position:absolute;right:9%;bottom:8%;width:7cqw;height:7cqw;background:var(--rc);transform:rotate(45deg);border-radius:1px}

/* Overlays */
.opener,.lightbox,.editor,.busy{position:fixed;inset:0}
.opener,.lightbox{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.opener{z-index:40;background:radial-gradient(ellipse at 50% 30%,#1b2140,var(--bg) 70%)}
.lightbox{z-index:50;background:rgba(6,8,12,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);gap:22px}
.lightbox.sheet{z-index:55;justify-content:flex-start;overflow-y:auto;gap:18px;padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
.sheet .lb-card{width:min(56vw,240px,calc((100dvh - 420px)*5/7));min-width:150px}
.sheet-form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;z-index:5}
.o-body{width:100%;max-width:560px;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.o-body.scroll{justify-content:flex-start;overflow-y:auto;padding:46px 12px 10px}
.hint{color:var(--muted);font-size:13px;letter-spacing:.04em}
.deck{position:relative;width:min(68vw,300px,calc((100dvh - 300px)*5/7));aspect-ratio:5/7;cursor:pointer;flex:none}
.slot{position:absolute;inset:0;transition:transform .45s cubic-bezier(.3,.7,.3,1),opacity .35s}
.slot.gone{transform:translateX(130%) rotate(16deg)!important;opacity:0}
.slot.hide{opacity:0}
.meta{min-height:76px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.meta .nm{font:400 30px/1 var(--display);overflow-wrap:anywhere}
.flash{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(circle at 50% 45%,var(--rc),transparent 62%);animation:flash .9s ease-out forwards}
.flash.ultra{background:conic-gradient(from 0deg at 50% 45%,#35f0ff,#fff,#7a5cff,#ff5bd6,#fff,#35f0ff);animation-duration:2s}
.flash.big{background:conic-gradient(from 0deg at 50% 45%,#ff6b6b,#ffd36b,#6bff95,#6bd6ff,#b36bff,#ff6bd6,#ff6b6b);animation-duration:1.3s}
@keyframes flash{0%{opacity:0}18%{opacity:.4}100%{opacity:0}}
.flash.ultra,.flash.big{-webkit-mask:radial-gradient(ellipse 34% 30% at 50% 45%,transparent 60%,#000 100%);mask:radial-gradient(ellipse 34% 30% at 50% 45%,transparent 60%,#000 100%)}
.sum-h{font:400 34px/1 var(--display);text-align:center}
.sum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;width:100%}
@media(min-width:520px){.sum-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lb-card{width:min(74vw,330px,calc((100dvh - 200px)*5/7))}
.lb-meta{text-align:center;display:flex;flex-direction:column;gap:6px}
.lb-name{font:400 30px/1 var(--display);overflow-wrap:anywhere}

/* Editor */
.editor{z-index:35;background:var(--bg);display:flex;flex-direction:column}
.ed-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.ed-title{font:400 22px/1 var(--display)}
.ed-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;width:100%;max-width:640px;margin:0 auto;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:26px}
.ed-bar{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar-gap{flex:1}
.busy{z-index:65;background:rgba(6,8,12,.82);display:grid;place-items:center;padding:16px}
.busy-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 26px;min-width:240px;max-width:100%;text-align:center;display:flex;flex-direction:column;gap:14px}
.pbar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:70;background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100vw - 32px);text-align:center}
.opener:not([hidden]) ~ .toast,.lightbox:not([hidden]) ~ .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media(max-width:400px){.sell-bar .sum{display:none}.tabs button{font-size:9.5px;letter-spacing:0}.tabs{grid-template-columns:repeat(5,1fr) 44px}}
@media(max-height:660px){.sum-scroll{padding-top:40px}.sell-bar{gap:6px;padding-top:8px}.sell-bar .btn{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Gratis-Uhr, Duplikate, Alle-oeffnen */
.free-clock{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:9px 14px;font:400 13px/1.3 var(--mono);color:var(--muted)}
.free-clock.ok{border-color:var(--accent);color:var(--fg)}
.free-clock .fc-ico{font-size:17px}
.dup-panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.dup-panel b{font-weight:500;display:block}
.dup-panel small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.chip.dup.on{border-color:var(--accent)}
.sel-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sel-row::-webkit-scrollbar{display:none}
.sel-row .chip{flex:none}
.open-all{display:flex;flex-direction:column;align-items:center;gap:22px}
.oa-stack{position:relative;width:min(46vw,190px);aspect-ratio:5/8}
.oa-stack i{position:absolute;inset:0;border-radius:12px;background:linear-gradient(160deg,var(--f1,#3a4466),var(--f2,#1b2030));border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 22px rgba(0,0,0,.45);animation:oa-fan 1s cubic-bezier(.2,.8,.2,1) both}
.oa-stack i:nth-child(1){--rot:-26deg;--dx:-62px}.oa-stack i:nth-child(2){--rot:-15deg;--dx:-36px}.oa-stack i:nth-child(3){--rot:-5deg;--dx:-12px}
.oa-stack i:nth-child(4){--rot:5deg;--dx:12px}.oa-stack i:nth-child(5){--rot:15deg;--dx:36px}.oa-stack i:nth-child(6){--rot:26deg;--dx:62px}
@keyframes oa-fan{from{transform:none;opacity:.2}to{transform:translateX(var(--dx)) rotate(var(--rot));opacity:1}}

/* Helles Design */
:root[data-theme=light]{--bg:#f3f0e8;--surface:#ffffff;--surface-2:#ebe6da;--line:#d6cfbf;--fg:#1b1e27;--muted:#666b79;--accent:#8c6a14;color-scheme:light}
:root[data-theme=light] .btn.primary{color:#fff}
:root[data-theme=light] .opener{background:radial-gradient(ellipse at 50% 30%,#fffdf6,var(--bg) 70%)}
:root[data-theme=light] .lightbox,:root[data-theme=light] .busy{background:rgba(240,236,226,.92)}

/* Einstellungen */
.set-sec{display:flex;flex-direction:column;gap:12px}
.set-sec h3{font-size:22px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:11px 6px;font-size:14px;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#1a1608)}
:root[data-theme=light] .seg button[aria-pressed=true]{color:#fff}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px}
.switch button{width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;padding:0;flex:none}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2));border-color:var(--accent)}
.switch button[aria-pressed=true]::after{transform:translateX(18px);background:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.warn-note{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.dlg{z-index:60;justify-content:center}
.dlg-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.dlg-box h3{font-size:26px}
.dlg-box .code{letter-spacing:.5em;text-align:center;font:500 24px var(--mono)}
.dlg-box.bad{animation:dlgshake .35s}
@keyframes dlgshake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.cheat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cheat-grid .btn{padding:10px 4px;font-size:13px}
.bal{font:400 30px/1 var(--display);color:var(--accent)}
.price-in{display:flex;align-items:center;gap:10px}
.price-in input{font:400 22px var(--mono);text-align:right}
.price-in b{font:400 26px var(--display);color:var(--accent)}
.seg.small button{padding:9px 6px;font-size:13px}

/* Slot */
.sl-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sl-head h2{font-size:clamp(17px,4.9vw,28px);min-width:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.sl-head .btn{flex:none}
.sl-machine{position:relative;container-type:inline-size;border-radius:20px;overflow:hidden;border:2px solid var(--sl-fr,#3a3350);background:radial-gradient(ellipse at 50% 15%,#3a2a66,#120d24 72%);padding:3cqw;isolation:isolate;color:#fff}
.sl-machine.fs-on{box-shadow:0 0 0 2px var(--fs2,#c14bff),0 0 30px -4px color-mix(in srgb,var(--fs2,#c14bff) 70%,transparent)}
.sl-bg{position:absolute;inset:0;z-index:-2}
.sl-bg{overflow:hidden}
.sl-dim{position:absolute;inset:0;z-index:-1;background:#000;opacity:var(--dim,.35)}
.sl-frame{display:flex;flex-direction:column;gap:2.5cqw}
.sl-fs{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(90deg,var(--fs1,#6b3dff),var(--fs2,#c14bff));color:#fff;border-radius:10px;padding:6px 12px;font:500 12.5px var(--mono)}
.sl-fs b{letter-spacing:.1em;text-transform:uppercase}
.sl-fs-won{color:var(--win,#ffe9a8)}
.sl-reels{position:relative;aspect-ratio:5/4;container-type:size;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.4cqw}
.reel{position:relative;overflow:hidden;border-radius:2.4cqw;background:var(--sl-rb,rgba(8,6,20,.66));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 3cqw rgba(0,0,0,.6)}
.reel.spinning .strip{filter:blur(.9px)}
.strip{will-change:transform}
.sc{height:25cqh;display:flex;align-items:center;justify-content:center;font-size:min(11cqw,13cqh);line-height:1;transition:opacity .3s,filter .3s}
.sc span{display:block;line-height:1}
.sc img{width:78%;height:78%;object-fit:contain;display:block}
.sc.s8{text-shadow:0 0 .8em var(--win,#ffd36b)}
.sc.s9{filter:drop-shadow(0 0 .35em #c78bff)}
.sc.hit{animation:hitp .6s ease-in-out infinite alternate;z-index:1;filter:drop-shadow(0 0 .45em var(--win,#ffd36b))}
.sc.dimmed{opacity:.32}
@keyframes hitp{from{transform:scale(1)}to{transform:scale(1.14)}}
.sl-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.sl-lines polyline{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9;filter:drop-shadow(0 0 3px rgba(0,0,0,.8))}
.sl-win{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;z-index:5;transition:opacity .25s,transform .25s;background:rgba(10,8,24,.82);border:1px solid rgba(255,211,107,.7);border-radius:16px;padding:8px 22px;color:#ffd36b;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);min-width:46%}
.sl-win.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sl-win small{display:block;font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff}
.sl-win small.wmx{color:var(--win,#ffd36b);letter-spacing:.1em}
.sl-win b{display:block;font:400 clamp(26px,9cqw,40px)/1.1 var(--display)}
.sl-win.big{border-color:#ffd36b;box-shadow:0 0 28px -2px #ffd36bcc}
.sl-win.mega{border-color:#ff6bd6;box-shadow:0 0 36px 0 #ff6bd6cc;color:#fff}
.sl-win.scat{border-color:#c78bff;color:#e6c9ff;box-shadow:0 0 28px -2px #b36bffcc}
.sl-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:359px){.sl-head{flex-wrap:wrap;gap:6px}.sl-head h2{font-size:22px}.sl-bar{grid-template-columns:1fr 1fr}.sl-bar .sl-bet{grid-column:1/-1;order:3;justify-self:center}.sl-bar .sl-stat:first-child{grid-column:1}.sl-stat b{font-size:15px}}
.sl-stat small,.sl-bet small{display:block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sl-stat b{font:500 16px var(--mono);color:var(--accent);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-stat:last-child{text-align:right}
.sl-bet{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 6px}
.sl-bet button{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--btn,var(--surface-2));color:var(--btn-fg,inherit);font-size:22px;line-height:1;padding:0}
.sl-bet button:disabled{opacity:.35}
.sl-bet div{text-align:center;min-width:74px}
.sl-bet b{font:500 15px var(--mono)}
.sl-ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
.sl-spin{width:104px;height:104px;flex:none;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--spin1,#ffe9a8),var(--spin2,var(--accent)) 60%,color-mix(in srgb,var(--spin2,var(--accent)) 62%,#000));color:var(--spin-fg,#1a1608);font:700 13px var(--body);letter-spacing:.06em;box-shadow:0 6px 0 color-mix(in srgb,var(--spin2,var(--accent)) 40%,#000),0 10px 22px rgba(0,0,0,.4);padding:0}
.sl-spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--spin2,var(--accent)) 40%,#000)}
.sl-spin:disabled{opacity:.6}
.sl-side{flex:1;min-width:0;flex-direction:column;font-size:13px;padding:10px 6px;gap:2px}
.sl-side small{display:block;font:400 11px var(--mono);opacity:.85}
.sl-side[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#1a1608)}
table.pt{width:100%;border-collapse:collapse;font:400 13px var(--mono)}
.pt th,.pt td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
.pt td:nth-child(2){text-align:left;font-family:var(--body)}
.sc-i{display:inline-block;font-size:22px;width:34px;text-align:center;line-height:1}
.sc-i img{width:24px;height:24px;object-fit:contain;vertical-align:middle}
.pt-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.pt-list b{color:var(--fg);font-weight:600}

/* Spiele-Knoepfe auf Home */
.games{display:flex;gap:12px}
.games .gbtn{flex:0 1 88px;width:auto;min-width:62px}
.gbtn{width:88px;height:88px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0;color:var(--fg);box-shadow:0 4px 14px -6px rgba(0,0,0,.5)}
.gbtn svg{width:34px;height:34px}
.gbtn small{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gbtn:active{transform:scale(.96)}

/* Gacha */
.ga-bal{color:var(--accent);font-size:13px}
.ga-machine{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:14px;background:linear-gradient(150deg,var(--f1),var(--f2));color:#fff}
.ga-machine small{display:block;margin-top:4px;color:rgba(255,255,255,.7)}
.ga-name{display:block;font:400 26px/1.1 var(--display);color:var(--ta,#fff)}
.ga-ball{position:relative;width:54px;height:54px;flex:none;border-radius:50%;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
.ga-ball i:first-child{position:absolute;inset:0 0 50% 0;background:var(--ta,#ffd36b)}
.ga-ball i:last-child{position:absolute;inset:50% 0 0 0;background:#eef1f8}
.ga-rate{font:400 12px var(--mono);text-align:right}
#ga-body{display:flex;flex-direction:column;gap:24px}
.ga-rates .prog{grid-template-columns:14px 82px 1fr auto}
.ga-rates .pc{white-space:nowrap}
.up-grid{margin-top:12px}
.ga-pities{display:flex;flex-direction:column;gap:10px}
.ga-pity{display:grid;grid-template-columns:1fr 84px 62px;gap:10px;align-items:center;font-size:13px}
.ga-pity .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.ga-pity .bar i{display:block;height:100%;background:var(--accent)}
.ga-pity b{font:500 12px var(--mono);color:var(--muted);text-align:right}
.ga-buy{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ga-buy .btn{flex-direction:column;gap:2px}
.ga-buy small{font:400 12px var(--mono);opacity:.85}
.capsule{--rc:var(--r-common);position:relative;width:min(56vw,210px);aspect-ratio:1;cursor:pointer;animation:capbob 1.6s ease-in-out infinite alternate}
.capsule i{position:absolute;left:0;right:0;height:50%;display:block}
.cap-top{top:0;border-radius:999px 999px 0 0/100% 100% 0 0;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 55%,#fff),var(--rc) 55%,color-mix(in srgb,var(--rc) 55%,#000));transform-origin:0 100%;transition:transform .7s cubic-bezier(.3,.8,.3,1),opacity .6s .2s}
.cap-bot{bottom:0;border-radius:0 0 999px 999px/0 0 100% 100%;background:radial-gradient(circle at 40% 20%,#fff,#d9deea 60%,#98a0b4)}
.capsule::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 4px);height:8px;background:#20232e;opacity:.5;z-index:2;transition:opacity .3s}
.capsule.open{animation:none}
.capsule.open::after{opacity:0}
.capsule.open .cap-top{transform:translate(-30%,-90%) rotate(-50deg);opacity:0}
.cap-glow{position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,var(--rc),transparent 62%);opacity:0;transition:opacity .6s;z-index:-1}
.capsule.open .cap-glow{opacity:.7}
@keyframes capbob{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-10px) rotate(3deg)}}
.up-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.up-grid .cell{position:relative;cursor:pointer}
.up-grid .cell.on .thumb{outline:2px solid var(--accent);outline-offset:2px}
.up-grid .val{display:block;text-align:center;font:400 10.5px var(--mono);color:var(--muted);margin-top:4px;white-space:nowrap}
.selq{position:absolute;top:-7px;left:-5px;z-index:3;border-radius:999px;font:600 11px var(--mono);padding:1px 8px;background:var(--accent);color:#1a1608}
.up-duel{display:flex;flex-direction:column;align-items:center;gap:12px}
.up-gauge{position:relative;width:min(60vw,220px);aspect-ratio:1}
.up-gauge svg{width:100%;height:100%}
.g-bg{fill:none;stroke:var(--surface-2);stroke-width:12}
.g-win{fill:none;stroke:#4ade80;stroke-width:12}
.g-ptr{position:absolute;inset:0}
.g-ptr i{position:absolute;left:50%;top:-1%;width:5px;height:15%;margin-left:-2.5px;background:var(--fg);border-radius:3px;box-shadow:0 0 8px var(--accent)}
.g-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.g-mid b{font:400 34px var(--display)}
.g-mid small{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* KI-Set */
.sa-prog{display:flex;flex-direction:column;gap:8px}
.sa-line{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.sa-line.ok{color:var(--fg)}.sa-line.err{color:#ff9aa8}
.sa-line .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* KI-Anbieter */
textarea{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:13px/1.45 var(--mono);width:100%;min-width:0;resize:vertical;min-height:64px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ap{display:flex;flex-direction:column;gap:12px}
.ap-help{margin:0;max-width:none}
.ap-more-in{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.ap-out{margin:0;max-width:none;min-height:1.3em;overflow-wrap:anywhere}
.ap-ok{color:#7ddc9a}.ap-bad{color:#ff9aa8}
.ap-prev{display:block;margin-top:8px;width:min(40vw,140px);border-radius:10px;border:1px solid var(--line)}
.set-sub{font-size:16px;margin:6px 0 -4px}
:root[data-theme=light] .ap-ok{color:#1d7a43}:root[data-theme=light] .ap-bad{color:#b3243a}


/* Home: Widgets */
.tiles.hcanvas{display:block;position:relative;width:100%}
.hcanvas .hc-empty{position:absolute;inset:0 0 auto 0}
.widget{position:absolute;min-width:0;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;border-radius:14px}
.widget .w-body{flex:none;width:100%;height:100%;display:flex;flex-direction:column;min-width:0;zoom:var(--fs,1)}
.widget .w-body>.tile,.widget .w-body>.games{flex:1;min-height:0;overflow:hidden}
.widget.nobg .w-body>.tile{background:transparent;border-color:transparent;box-shadow:none}
.widget.wt-games .games{justify-content:flex-start;align-items:center}
.widget.editing{overflow:visible;touch-action:none;cursor:grab;outline:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;user-select:none;-webkit-user-select:none}
.widget.editing .w-body{pointer-events:none;opacity:.92}
.widget.editing.sel{outline:2px solid var(--accent);outline-offset:2px}
.widget.drag{cursor:grabbing;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.w-lab{position:absolute;left:8px;top:-9px;z-index:2;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:color-mix(in srgb,var(--bg) 78%,transparent);color:var(--muted);padding:2px 6px;border-radius:6px;pointer-events:none;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.widget.sel .w-lab{color:var(--accent)}
.w-rs{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:nwse-resize;touch-action:none;display:none}
.w-rs::after{content:"";position:absolute;inset:8px;border-right:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:translate(2px,2px) scale(.8)}
.widget.editing.sel .w-rs{display:block}
.w-panel{position:sticky;bottom:8px;z-index:30;background:color-mix(in srgb,var(--surface) 96%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.wp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wp-head b{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.wp-head small{color:var(--muted);font:400 11px var(--mono)}
.wp-row{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.wp-row::-webkit-scrollbar{display:none}
.wp-b{flex:none;min-width:42px;padding:7px 9px!important;font-size:15px!important;min-height:40px}
.wp-hint{margin:0;font-size:11px;color:var(--muted);line-height:1.35}
.wp-fs{font:500 12px var(--mono);color:var(--muted);min-width:44px;text-align:center}
.w-note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;margin:0}
.w-name{font:400 20px/1.1 var(--display);overflow-wrap:anywhere}
.w-bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;width:100%}
.w-bar i{display:block;height:100%;background:var(--accent)}
.w-media{padding:0!important;overflow:hidden;gap:0!important}
.wm-box{position:relative;width:100%;flex:1;min-height:0;overflow:hidden;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.w-empty{font-size:13px}
.w-cap{padding:8px 12px;display:block}
.w-case .case.small{width:min(100%,92px)}
.wadd-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.wadd-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.wadd-row b{font-weight:600}
.wadd-row small{color:var(--muted);font-size:12.5px}
/* Design-Speicher */
.ds-list{display:flex;flex-direction:column;gap:8px}
.ds-row{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.ds-sw{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:block;flex:none}
.ds-n{display:flex;flex-direction:column;min-width:0}
.ds-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ds-n small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-act{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.hid-row .ds-sw{margin-right:2px}
/* Comics */
.cx-tabs{margin:2px 0 10px}
.cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 12px;margin-top:6px}
.cx-book{display:flex;flex-direction:column;gap:6px;min-width:0}
.cx-cover{position:relative;display:block;width:100%;aspect-ratio:2/3;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:linear-gradient(160deg,var(--surface-2),var(--surface));padding:0}
.cx-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.cx-cover.has img{opacity:1}
.cx-ph{position:absolute;inset:0;display:grid;place-items:center;font:600 34px var(--display);color:var(--muted)}
.cx-cover.has .cx-ph{display:none}
.cx-bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.45)}
.cx-bar b{display:block;height:100%;background:var(--accent)}
.cx-t{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;min-width:0}
.cx-tt{display:flex;flex-direction:column;min-width:0;flex:1}
.cx-tt b{font-size:13px;font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cx-tt small{color:var(--muted);font:400 11px var(--mono)}
.cx-more{padding:4px 10px;flex:none}
.cx-cont{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,var(--surface-2),var(--surface));padding:10px;margin-bottom:12px}
.cx-cont-i{flex:none;width:52px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--surface);display:block}
.cx-cont-i img{width:100%;height:100%;object-fit:cover;display:block}
.cx-cont-t{display:flex;flex-direction:column;min-width:0}
.cx-cont-t b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-cont-t small{color:var(--muted);font:400 11px var(--mono);text-transform:uppercase;letter-spacing:.06em}
.cx-addr{display:flex;gap:8px}
.cx-addr input{flex:1;min-width:0}
.cx-marks{margin:2px 0}
.cx-marks .chip{padding:0;overflow:hidden}
.cx-mk{background:none;border:0;color:inherit;padding:6px 6px 6px 13px;font-size:13px;max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-mx{background:none;border:0;color:var(--muted);padding:6px 11px 6px 4px;font-size:15px;line-height:1}
.cx-frame{height:62vh;height:62dvh;min-height:300px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin:10px 0}
.cx-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.cx-frame-e{height:100%;display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:center;padding:18px;background:var(--surface);color:var(--muted);font-size:14px}
.cx-frame-e b{color:var(--fg)}
.cx-h{font-size:17px;margin:14px 0 4px}
.cx-crumb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.cx-crumb b{flex:1;min-width:0;text-align:center;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx-sort{margin:4px 0 2px}
.cx-fgrid{position:absolute;inset:8px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:4px;overflow:hidden;border-radius:6px}
.cx-cover .cx-fgrid img{position:static;inset:auto;width:100%;height:100%;opacity:1;object-fit:cover;border-radius:4px;background:var(--surface)}
.cx-fico{position:absolute;right:6px;bottom:6px;font-size:18px;background:rgba(0,0,0,.6);border-radius:8px;padding:1px 5px;line-height:1.3}
.cx-book.sel .cx-cover{outline:3px solid var(--accent);outline-offset:-3px}
.cx-chk{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.5);color:#1a1608;font-weight:700;display:grid;place-items:center;font-size:14px;line-height:1}
.cx-chk.on{background:var(--accent);border-color:var(--accent)}
.cx-selbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--accent);border-radius:12px;padding:8px 10px;margin:0 0 10px;flex-wrap:wrap}
.cx-selbar b{flex:1 1 90px;min-width:0}
.cx-sug{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;margin:2px 0 12px;font-size:13.5px}
.cx-sug span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.cx-sug .btn{flex:none}
.cx-hint{color:var(--muted);font-size:13px;margin:0;max-width:none}
/* Leser */
.reader{position:fixed;inset:0;z-index:52;background:#05060a;color:#e9ebf2;-webkit-user-select:none;user-select:none;overflow:hidden}
.rd-stage{position:absolute;inset:0;overflow:auto;display:flex;-webkit-overflow-scrolling:touch}
.rd-img{margin:auto;display:block;max-width:100%;max-height:100%;object-fit:contain;flex:none}
.rd-img.bad{display:none}
.reader[data-fit=width] .rd-img{width:100%;max-height:none;height:auto}
.reader.zoomed .rd-img{max-width:none;max-height:none;width:230%;height:auto}
.rd-strip{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.rd-s{min-height:70vh;display:flex;justify-content:center;align-items:center;color:var(--muted);font-size:13px}
.rd-s.on{min-height:0;display:block}
.rd-s img{display:block;width:100%;height:auto}
.rd-top,.rd-bot{position:absolute;left:0;right:0;z-index:2;display:flex;gap:10px;align-items:center;transition:opacity .2s}
.rd-top{top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 22px;justify-content:space-between;background:linear-gradient(rgba(5,6,10,.88),rgba(5,6,10,0))}
.rd-title{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-bot{bottom:0;flex-direction:column;align-items:stretch;padding:26px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(rgba(5,6,10,0),rgba(5,6,10,.92))}
.reader.noui .rd-top,.reader.noui .rd-bot{opacity:0;pointer-events:none}
.rd-sl{display:flex;align-items:center;gap:12px}
.rd-sl input{flex:1;min-width:0;accent-color:var(--accent)}
.rd-sl span{font:500 12px var(--mono);color:#aeb4c4;min-width:64px;text-align:right}
.rd-btns{display:flex;gap:6px;flex-wrap:wrap}
.rd-btns button{flex:1 1 auto;border:1px solid #283044;background:#141822;color:#e9ebf2;border-radius:9px;padding:9px 10px;font-size:13px}
.rd-btns button[hidden]{display:none}
.reader[data-mode=strip] .rd-only-page{display:none}
/* Cases verstecken */
.hid-list{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto}
.hid-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.hid-btn{gap:6px;margin-top:10px;align-self:flex-start;opacity:.85}

    <button role="tab" id="tab-set" class="tab-set" data-view="set" aria-selected="false" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

<script>(() => {
  'use strict';

  // ================= Konstanten und Helfer =================
  const RARITIES = [
    { k: 'common', n: 'Common' }, { k: 'rare', n: 'Rare' }, { k: 'epic', n: 'Epic' },
    { k: 'legendary', n: 'Legendary' }, { k: 'mythic', n: 'Mythic' }, { k: 'ultra', n: 'Ultra' },
  ];
  const RIDX = { common: 0, rare: 1, epic: 2, legendary: 3, mythic: 4, ultra: 5 };
  const DEF_ODDS = { common: 62, rare: 24, epic: 9, legendary: 4, mythic: 1, ultra: 0 };
  // Geld: Startoken, Zeichen ☆, immer als ganze Cent-Betraege gerechnet (1 ☆ = 100).
  // Kartenwert je Seltenheit: Spanne in Cent, pro Karte fest "gewuerfelt" (z. B. 2,43☆), ausser die Karte hat einen eigenen Wert.
  const TIER_RANGE = { common: [5, 35], rare: [30, 120], epic: [150, 500], legendary: [600, 2500], mythic: [4000, 16000], ultra: [80000, 250000] };
  const MONEY_VER = 2;
  const THEMES = [['nacht', 'Nacht'], ['ozean', 'Ozean'], ['glut', 'Glut'], ['wald', 'Wald'], ['violett', 'Violett'], ['gold', 'Gold']];
  const LOOKS = [['auto', 'Auto'], ['none', 'Ohne'], ['sheen', 'Sanft'], ['foil', 'Folie'], ['gold', 'Gold'], ['rainbow', 'Regenbogen'], ['ultra', 'Ultra']];
  const HL_BY_RARITY = { common: 'none', rare: 'sheen', epic: 'foil', legendary: 'gold', mythic: 'rainbow', ultra: 'ultra' };
  const MAX_CARDS = 1000;
  const MAX_EDGE = 640;
  const REF_RE = /^[al]:[A-Za-z0-9_-]{1,64}$/;

  // ================= Absturz-Waechter =================
  // Beim Start wird eine Markierung gesetzt und nach einigen ruhigen Sekunden (oder beim normalen Schliessen) wieder entfernt.
  // Steht sie beim naechsten Start noch da, ist die App abgestuerzt (zum Beispiel weil dem iPhone der Speicher ausging).
  // Dann startet sie im sicheren Modus: Fotos werden nicht geladen, bis man sie selbst einschaltet.
  const GUARD_KEY = 'jb-boot', SAFE_KEY = 'jb-safe';
  let SAFE = false, CRASH = null, guardT = null;
  try {
    const g = JSON.parse(localStorage.getItem(GUARD_KEY) || 'null');
    if (g && typeof g === 'object' && g.t) { CRASH = { v: String(g.v || 'boot').slice(0, 40), t: +g.t || 0 }; localStorage.setItem(SAFE_KEY, '1'); }
    SAFE = localStorage.getItem(SAFE_KEY) === '1';
  } catch (e) { SAFE = false; }
  function guardClear() { clearTimeout(guardT); guardT = null; try { localStorage.removeItem(GUARD_KEY); } catch (e) { /* egal */ } }
  function guardArm(label, ms) {
    try { localStorage.setItem(GUARD_KEY, JSON.stringify({ v: label, t: Date.now() })); } catch (e) { return; }
    clearTimeout(guardT); guardT = setTimeout(guardClear, ms || 5000);
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) guardClear(); });
  window.addEventListener('pagehide', guardClear);
  guardArm('boot', 6000);

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const clampInt = (v, lo, hi, d) => { v = Math.round(+v); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad = n => String(n).padStart(3, '0');
  const uid = (n = 6) => { const a = 'abcdefghijklmnopqrstuvwxyz0123456789'; let s = ''; for (let i = 0; i < n; i++) s += a[Math.floor(Math.random() * a.length)]; return s; };
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const rar = k => RARITIES[RIDX[k]] || RARITIES[0];
  const fmtPct = x => (x > 0 && x < 0.01 ? Math.round(x * 1000) / 1000 : x > 0 && x < 0.1 ? Math.round(x * 100) / 100 : Math.round(x * 10) / 10).toString().replace('.', ',');
  // 123456 -> "1.234,56"
  const fmtNum = c => { c = Math.round(+c || 0); const neg = c < 0; c = Math.abs(c); const e = Math.floor(c / 100), ct = c % 100; return (neg ? '-' : '') + String(e).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + String(ct).padStart(2, '0'); };
  const fmtTok = c => fmtNum(c) + '☆';
  // "12,5" / "12.50" / "1.234,56" -> Cent (oder null)
  function parseMoney(t) {
    let s = String(t == null ? '' : t).replace(/[☆\s€]/g, '');
    if (!s) return null;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    else if (/^\d{1,3}\.\d{3}$/.test(s)) s = s.replace('.', '');
    const x = parseFloat(s);
    return Number.isFinite(x) && x >= 0 ? Math.round(x * 100) : null;
  }

  let toastT;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 2800);
  }
  function busy(msg, pct) {
    const b = $('#busy');
    if (msg == null) { b.hidden = true; b.innerHTML = ''; return; }
    b.hidden = false;
    b.innerHTML = `<div class="busy-card"><div>${esc(msg)}</div>${pct != null ? `<div class="pbar"><i style="width:${Math.round(pct * 100)}%"></i></div>` : ''}</div>`;
  }
  let lastErr = 0;
  function reportErr(e, msg) {
    console.error(e);
    const now = Date.now();
    if (now - lastErr > 4000) { lastErr = now; toast(msg || 'Speichern fehlgeschlagen.'); }
  }
  async function retry(fn, n = 2) {
    for (let i = 0; ; i++) {
      try { return await fn(); } catch (e) {
        const c = e && e.code;
        if (i >= n || !(c === 'store_unavailable' || c === 'rate_limited' || c === 'unavailable')) throw e;
        await sleep(700 * (i + 1));
      }
    }
  }
  async function pool(items, n, fn) {
    let i = 0;
    const worker = async () => { while (i < items.length) { const it = items[i++]; await fn(it); } };
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  }
  const readAs = (blob, how) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = () => rej(r.error);
    r[how](blob);
  });
  const blobToDataURL = b => readAs(b, 'readAsDataURL');
  function dataURLToBlob(u) {
    const m = /^data:([^;,]+)(;base64)?,([\s\S]*)$/.exec(u);
    if (!m) throw new Error('bad data url');
    const bin = atob(m[3]);
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: m[1] });
  }

  // Kleines Standbild (JPEG, lange Seite 320 px) von einem Foto, GIF oder Video. In Rastern werden nur diese Standbilder gezeigt:
  // Dadurch laufen dort keine GIFs/Videos, und das Handy muss keine grossen Bilder dekodieren.
  const THUMB_EDGE = 320;
  async function toThumb(src, w, h) {
    const s = Math.min(1, THUMB_EDGE / Math.max(w, h));
    const cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
    const cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#10131b'; ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(src, 0, 0, cw, ch);
    const out = await new Promise(res => cv.toBlob(b => res(b), 'image/jpeg', 0.72));
    cv.width = cv.height = 0;   // Speicher auf iOS freigeben
    return out;
  }
  async function videoFrame(blob) {
    const u = URL.createObjectURL(blob), v = document.createElement('video');
    try {
      v.muted = true; v.defaultMuted = true; v.playsInline = true; v.preload = 'auto';
      v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
      let timer;
      const ready = new Promise((res, rej) => {
        v.onloadeddata = () => res();
        v.onerror = () => rej(new Error('Video nicht lesbar'));
        timer = setTimeout(() => rej(new Error('Video zu langsam')), 5000);
      });
      v.src = u;
      try { v.load(); } catch (e) { /* egal */ }
      try { const p = v.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* iOS laedt manchmal erst nach play() */ }
      await ready; clearTimeout(timer);
      try { v.pause(); } catch (e) { /* egal */ }
      if (isFinite(v.duration) && v.duration > 0.2) {
        await new Promise(res => { const t = setTimeout(res, 1500); v.onseeked = () => { clearTimeout(t); res(); }; try { v.currentTime = Math.min(0.15, v.duration / 2); } catch (e) { res(); } });
      }
      if (!v.videoWidth || !v.videoHeight) throw new Error('Video leer');
      return await toThumb(v, v.videoWidth, v.videoHeight);
    } finally { try { v.removeAttribute('src'); v.load(); } catch (e) { /* egal */ } URL.revokeObjectURL(u); }
  }
  async function makeThumb(blob, isVideo) {
    try {
      if (isVideo || /^video\//.test(blob.type || '')) return await videoFrame(blob);
      let bmp;
      try { bmp = await createImageBitmap(blob); } catch (e) { bmp = await loadImg(blob); }
      const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
      if (!w || !h) return null;
      const out = await toThumb(bmp, w, h);
      if (bmp.close) bmp.close();
      return out;
    } catch (e) { console.warn('Vorschaubild', e); return null; }
  }

  // ================= Speicher (Cloud oder lokal) =================
  const idbP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  function idbOpen() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('jopenbox', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('docs'); d.createObjectStore('photos'); };
      r.onsuccess = () => { const d = r.result; d.onversionchange = () => { try { d.close(); } catch (e) { /* egal */ } }; res(d); };   // damit "Alles loeschen" die Datenbank nicht blockiert
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    });
  }

  async function localBackend() {
    let db = null;
    try { if (window.indexedDB) db = await idbOpen(); } catch (e) { db = null; }
    const mem = { docs: new Map(), photos: new Map() };
    const urls = new Map(), blobs = new Map(), known = new Set();
    // Standbilder fuer Raster: Schluessel "t_<foto>" im selben Speicher; turls = fertige Anzeige-Adressen (klein, bleiben im Speicher)
    const tknown = new Set(), turls = new Map(), tfail = new Set();
    // Gross geladene Fotos, die nur fuer die Anzeige gebraucht werden, bleiben nicht fuer immer im Arbeitsspeicher:
    // lru merkt sich die Reihenfolge (aelteste zuerst) und die Groesse; Eintraege, die gerade auf dem Bildschirm stehen, werden nie entfernt.
    const lru = new Map();
    const LRU_MAX = 30, LRU_BYTES = 120 * 1048576;
    let photoErr = null;
    // Die Datenbank des iPhones meldet manchmal kurz "internal error". Ein zweiter oder dritter Versuch klappt dann oft.
    const tryIdb = async (fn, tries = 3) => { let err; for (let i = 0; i < tries; i++) { try { return await fn(); } catch (e) { err = e; await sleep(200 * (i + 1) * (i + 1)); } } throw err; };
    const st = (name, mode) => db.transaction(name, mode).objectStore(name);
    const cursorAll = (name, withVal, out) => new Promise((res, rej) => {
      const r = withVal ? st(name, 'readonly').openCursor() : st(name, 'readonly').openKeyCursor();
      r.onsuccess = () => { const c = r.result; if (c) { out(c); c.continue(); } else res(); };
      r.onerror = () => rej(r.error);
    });
    const stepErr = (step, e) => { const m = (e && e.message) || String(e); const x = new Error(m); x.step = step; return x; };
    const addKey = k => { k = String(k); if (k.startsWith('t_')) tknown.add(k.slice(2)); else known.add(k); };
    // Liste der vorhandenen Fotos (nur die Namen, nicht die Bilder)
    async function loadKeys() {
      if (!db) return;
      photoErr = null;
      try {
        await tryIdb(async () => {
          known.clear(); tknown.clear();
          try { (await idbP(st('photos', 'readonly').getAllKeys())).forEach(addKey); }
          catch (e) { known.clear(); tknown.clear(); await cursorAll('photos', false, c => addKey(c.key)); }
        });
      } catch (e) { known.clear(); tknown.clear(); photoErr = stepErr('photos', e); throw photoErr; }
    }
    const inUse = u => { try { return !!document.querySelector('[src^="' + u + '"]'); } catch (e) { return true; } };
    function forget(key) {
      const u = urls.get(key);
      if (u) URL.revokeObjectURL(u);
      urls.delete(key); blobs.delete(key); lru.delete(key);
    }
    function trim(protect) {
      let total = 0;
      lru.forEach(v => { total += v; });
      for (const [k, sz] of lru) {
        if (lru.size <= LRU_MAX && total <= LRU_BYTES) break;
        if (protect && protect.has(k)) continue;
        const u = urls.get(k);
        if (u && inUse(u)) continue;
        forget(k); total -= sz;
      }
    }
    const touch = key => { if (lru.has(key)) { const s = lru.get(key); lru.delete(key); lru.set(key, s); } };
    const mk = (key, data, type, protect) => {
      const b = data instanceof Blob ? data : new Blob([data], { type });
      blobs.set(key, b); urls.set(key, URL.createObjectURL(b));
      if (protect) { lru.set(key, b.size); trim(protect); }
    };
    // Fotos werden nicht alle beim Start gelesen (bei hunderten Bildern ist das zu viel fuers Handy), sondern erst, wenn eines angezeigt wird.
    // o.lru: nur fuer die Anzeige laden; das Foto darf spaeter wieder aus dem Arbeitsspeicher verschwinden.
    async function ensure(refs, o) {
      if (SAFE || !db) return;
      const lruMode = !!(o && o.lru);
      const all = [...new Set(refs.map(r => String(r).slice(2)))];
      if (lruMode) all.forEach(touch); else all.forEach(k => lru.delete(k));   // fest gebrauchte Medien (Designs, Home) werden nie verdraengt
      const keys = all.filter(k => known.has(k) && !urls.has(k));
      const protect = lruMode ? new Set(all) : null;
      for (let i = 0; i < keys.length; i += 6) {
        const part = keys.slice(i, i + 6);
        const s = st('photos', 'readonly');
        const vals = await Promise.all(part.map(k => idbP(s.get(k)).catch(() => null)));
        part.forEach((k, n) => { const v = vals[n]; if (v && v.b && !urls.has(k)) mk(k, v.b, v.t, protect); });
        if (keys.length > 6) await sleep(0);
      }
    }
    // Standbild speichern und anzeigbar machen
    const tmk = (key, buf, type) => { if (!turls.has(key)) turls.set(key, URL.createObjectURL(new Blob([buf], { type: type || 'image/jpeg' }))); };
    async function saveThumb(key, tb) {
      const buf = await readAs(tb, 'readAsArrayBuffer');
      if (db) { try { await idbP(st('photos', 'readwrite').put({ b: buf, t: 'image/jpeg' }, 't_' + key)); tknown.add(key); } catch (e) { /* nicht schlimm: in dieser Sitzung klappt es auch so */ } }
      tmk(key, buf, 'image/jpeg');
    }
    let tchain = Promise.resolve();   // fehlende Standbilder werden nacheinander erzeugt (spart Arbeitsspeicher)
    // Klappt das Standbild von Videos auf diesem Geraet nicht (manche Browser laden Videos nicht ohne Antippen), versuchen wir es nicht
    // fuer jedes einzelne Video erneut, sonst wuerde alles minutenlang warten.
    let vidFail = 0;
    async function thumbOf(blob, isVideo) {
      if (isVideo && vidFail >= 2) return null;
      const tb = await makeThumb(blob, isVideo);
      if (isVideo) vidFail = tb ? 0 : vidFail + 1;
      return tb;
    }
    async function thumbFor(ref, isVideo) {
      const key = String(ref).slice(2);
      if (turls.has(key)) return turls.get(key);
      if (!db || SAFE || !known.has(key)) return '';
      if (tknown.has(key)) {
        try {
          const v = await tryIdb(() => idbP(st('photos', 'readonly').get('t_' + key)), 2);
          if (v && v.b) { tmk(key, v.b, v.t); return turls.get(key) || ''; }
        } catch (e) { /* dann neu erzeugen */ }
      }
      if (tfail.has(key)) return '';
      const job = tchain.then(async () => {
        if (turls.has(key)) return turls.get(key);
        if (!known.has(key)) return '';
        try {
          const v = await idbP(st('photos', 'readonly').get(key));
          if (!v || !v.b) { tfail.add(key); return ''; }
          const tb = await thumbOf(new Blob([v.b], { type: v.t }), isVideo || /^video\//.test(v.t || ''));
          if (!tb) { tfail.add(key); return ''; }
          await saveThumb(key, tb);
          return turls.get(key) || '';
        } catch (e) { tfail.add(key); return ''; }
      });
      tchain = job.catch(() => {});
      return job;
    }
    return {
      mode: db ? 'local' : 'mem',
      lazy: true,
      thumbs: !!db,
      async loadDocs() {
        const out = {};
        if (!db) { mem.docs.forEach((v, k) => { out[k] = v; }); return out; }
        try {
          await tryIdb(async () => {
            const s = st('docs', 'readonly');
            const keys = await idbP(s.getAllKeys()), vals = await idbP(s.getAll());
            keys.forEach((k, i) => { out[k] = vals[i]; });
          });
        } catch (e1) {
          // zweiter Weg: Eintrag fuer Eintrag lesen
          try { await tryIdb(async () => { for (const k of Object.keys(out)) delete out[k]; await cursorAll('docs', true, c => { out[c.key] = c.value; }); }, 2); }
          catch (e2) { throw stepErr('docs', e1); }
        }
        try { await loadKeys(); } catch (e) { console.warn('Fotoliste nicht lesbar', e); }
        return out;
      },
      loadKeys,
      photoError: () => photoErr,
      async setDoc(k, v) {
        const copy = JSON.parse(JSON.stringify(v));
        if (!db) { mem.docs.set(k, copy); return; }
        await idbP(st('docs', 'readwrite').put(copy, k));
      },
      async delDoc(k) {
        if (!db) { mem.docs.delete(k); return; }
        await idbP(st('docs', 'readwrite').delete(k));
      },
      // o.cache === false: nur speichern, nicht im Arbeitsspeicher behalten (beim Speichern von vielen Karten)
      // o.thumb: gleich ein Standbild fuer Raster mit anlegen; o.video: ist ein Video (falls der Dateityp fehlt)
      async putPhoto(blob, o) {
        const key = uid(10), t = blob.type || (o && o.video ? 'video/mp4' : 'image/jpeg');
        const buf = await readAs(blob, 'readAsArrayBuffer');
        if (!db) mem.photos.set(key, { b: buf, t });
        else await idbP(st('photos', 'readwrite').put({ b: buf, t }, key));
        known.add(key);
        if (!db || !o || o.cache !== false) mk(key, db ? blob : buf, t);
        if (db && o && o.thumb) {
          try { const tb = await thumbOf(blob, o.video || /^video\//.test(t)); if (tb) await saveThumb(key, tb); } catch (e) { /* Standbild wird spaeter erzeugt */ }
        }
        return 'l:' + key;
      },
      async dropPhoto(ref) {
        const key = ref.slice(2), tu = turls.get(key);

  function cloudBackend(col, assets, snap, listed) {

    const srcFor = id => (mine.get(id) && mine.get(id).url) || urls.get(id) || '/_blob/' + id;

      loadKeys: async () => {}, photoError: () => null, thumbs: false, thumbFor: async () => '', thumbSrc: () => '',
      async loadDocs() {
        const out = {};
        snap.docs.forEach(d => { out[d.id] = JSON.parse(JSON.stringify(d.data())); });

      },
      setDoc: (k, v) => retry(() => col.doc(k).set(JSON.parse(JSON.stringify(v)))),

  // Preisliste fuers Drehrad (Cent), wie Preisschilder
  const PRICES = [99, 199, 299, 499, 799, 999, 1499, 1999, 2499, 2999, 3999, 4999, 5999, 7999, 9999, 12999, 14999, 19999, 24999, 29999, 39999, 49999, 74999, 99999, 149999, 199999, 299999, 499999, 999999, 2499999, 4999999, 9999999, 49999999, 99999999];

    if (m.cur !== MONEY_VER && oldTok) saveMeta();

    Object.keys(docs).forEach(k => {

      else if (k.startsWith('prog_')) S.prog[k.slice(5)] = normProg(docs[k]);
    });

  // ================= Spiellogik =================
  function pools(cs) {

    return keys[keys.length - 1];

    const p = pools(cs);

    for (let i = 0; i < cs.perBooster - 1; i++) out.push(draw(avail));

    out.push(draw(hi.length ? hi : avail)); // letzte Karte: mindestens Rare, falls vorhanden

  function artBlock(c, cls, lazy, forcePan) {
    // Raster-Vorschau eines gespeicherten Fotos/GIFs/Videos: nur das kleine Standbild
